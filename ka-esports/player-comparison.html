<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Comparison – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .comparison-setup { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .player-selector { flex: 1; min-width: 200px; }
    .player-selector select { width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 20px 0; }
    .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; }
    .chart-box h4 { text-align: center; margin: 0 0 10px; color: var(--accent); font-size: 0.95rem; }
    .player-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
    .player-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .player-card h3 { margin: 0 0 15px; font-size: 1.2rem; }
    .gauge-row { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
    .gauge-item { text-align: center; }
    .gauge-circle { position: relative; width: 70px; height: 70px; margin: 0 auto 5px; }
    .gauge-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .gauge-circle .bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .gauge-circle .fill { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
    .gauge-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .gauge-value { font-size: 0.9rem; font-weight: 700; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Player Comparison</h1>
      <p>Compare up to 4 active players. Independent charts for each metric.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="comparison-setup">
            <div class="player-selector">
              <label>Player 1</label>
              <select id="player1-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 2</label>
              <select id="player2-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 3</label>
              <select id="player3-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 4</label>
              <select id="player4-select"><option value="">-- Choose --</option></select>
            </div>
          </div>
          <div id="comparison-content">
            <p>Select at least two players to compare.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/api-loader.js"></script>
  <script>
    // Store chart instances to destroy them before creating new ones
    const chartInstances = [];

    function destroyAllCharts() {
      chartInstances.forEach(c => c.destroy());
      chartInstances.length = 0;
    }

    async function init() {
      const names = await fetchPlayerNames();
      for (let i = 1; i <= 4; i++) {
        populateSelectFromList(`player${i}-select`, names, '-- Choose --');
        document.getElementById(`player${i}-select`).addEventListener('change', compare);
      }
    }

    async function compare() {
      const container = document.getElementById('comparison-content');
      const chosen = [];
      for (let i = 1; i <= 4; i++) {
        const sel = document.getElementById(`player${i}-select`).value;
        if (sel) chosen.push(sel);
      }

      if (chosen.length < 2) {
        container.innerHTML = '<p>Select at least two players.</p>';
        destroyAllCharts();
        return;
      }
      if (new Set(chosen).size !== chosen.length) {
        container.innerHTML = '<p>Please select different players.</p>';
        return;
      }

      container.innerHTML = '<p>Loading comparison…</p>';

      try {
        const inactiveNames = await getInactivePlayerNames();
        if (chosen.some(name => inactiveNames.has(name))) {
          container.innerHTML = '<p>One of the selected players is inactive.</p>';
          return;
        }

        const playersData = await Promise.all(chosen.map(name => getPlayerStats(name)));

        // Build HTML for charts
        let html = '<div class="charts-grid" id="charts-grid"></div>';
        html += '<div class="player-cards" id="player-cards"></div>';
        container.innerHTML = html;

        // Colors per player
        const playerColors = ['#4a86e8', '#e94560', '#10b981', '#f59e0b'];

        // Define metrics with their labels and max values for gauges
        const metricsDef = [
          { key: 'rating', label: 'Rating', max: 2500 },
          { key: 'rd', label: 'RD', max: 350 },
          { key: 'winRate', label: 'Win Rate %', max: 100 },
          { key: 'avgPosition', label: 'Avg Position', max: 4 },
          { key: 'sos', label: 'SOS', max: 2500 }
        ];

        // Build one bar chart per metric
        destroyAllCharts();
        const chartsGrid = document.getElementById('charts-grid');
        metricsDef.forEach(metric => {
          const box = document.createElement('div');
          box.className = 'chart-box';
          box.innerHTML = `<h4>${metric.label}</h4><canvas id="chart-${metric.key}" width="300" height="200"></canvas>`;
          chartsGrid.appendChild(box);

          const ctx = document.getElementById(`chart-${metric.key}`).getContext('2d');
          const datasets = playersData.map((p, idx) => ({
            label: chosen[idx],
            data: [p[metric.key]],
            backgroundColor: playerColors[idx % playerColors.length],
            borderRadius: 4,
            barPercentage: 0.6
          }));

          const chart = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: [''],
              datasets: datasets
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: { display: true, position: 'bottom' },
                tooltip: {
                  callbacks: {
                    label: (ctx) => {
                      const val = ctx.raw;
                      if (metric.key === 'winRate') return `${ctx.dataset.label}: ${val.toFixed(1)}%`;
                      if (metric.key === 'rating' || metric.key === 'rd' || metric.key === 'avgPosition') return `${ctx.dataset.label}: ${val.toFixed(2)}`;
                      return `${ctx.dataset.label}: ${val.toFixed(0)}`;
                    }
                  }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  title: { display: false },
                  grid: { color: 'rgba(0,0,0,0.05)' }
                },
                x: { grid: { display: false } }
              }
            }
          });
          chartInstances.push(chart);
        });

        // Build player cards with circular gauges
        const cardsContainer = document.getElementById('player-cards');
        playersData.forEach((p, idx) => {
          const card = document.createElement('div');
          card.className = 'player-card';
          let cardHtml = `<h3>${chosen[idx]}</h3><div class="gauge-row">`;
          metricsDef.forEach(metric => {
            let raw = p[metric.key];
            let max = metric.max;
            let pct = Math.min(100, (raw / max) * 100);
            // Invert metrics where lower is better
            if (metric.key === 'avgPosition') pct = Math.min(100, ((4 - raw) / 4) * 100);
            if (metric.key === 'rd') pct = Math.min(100, ((350 - raw) / 350) * 100);
            const circumference = 2 * Math.PI * 28;
            const dashOffset = circumference * (1 - pct / 100);
            let displayVal;
            if (metric.key === 'winRate') displayVal = raw.toFixed(1) + '%';
            else if (metric.key === 'rating' || metric.key === 'rd') displayVal = raw.toFixed(0);
            else if (metric.key === 'avgPosition') displayVal = raw.toFixed(2);
            else displayVal = raw.toFixed(0);
            cardHtml += `
              <div class="gauge-item">
                <div class="gauge-circle">
                  <svg viewBox="0 0 70 70">
                    <circle class="bg" cx="35" cy="35" r="28"/>
                    <circle class="fill" cx="35" cy="35" r="28"
                            style="stroke:${playerColors[idx % playerColors.length]}; stroke-dasharray:${circumference}; stroke-dashoffset:${dashOffset};"/>
                  </svg>
                  <div class="gauge-value">${displayVal}</div>
                </div>
                <div class="gauge-label">${metric.label}</div>
              </div>`;
          });
          cardHtml += `</div>`;
          card.innerHTML = cardHtml;
          cardsContainer.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<p>Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    async function getPlayerStats(playerName) {
      const players = await fetchSheetData('PLAYERS');
      const header = players[0].map(h => (h || '').toString().trim());
      const nameIdx = header.indexOf('Name');
      const ratingIdx = header.indexOf('Rating');
      const rdIdx = header.indexOf('RD');
      const matchesIdx = header.indexOf('Matches');
      const winsIdx = header.indexOf('Wins');
      const sumPosIdx = header.indexOf('SumPositions');
      const recentOppIdx = header.indexOf('RecentOpponents');

      const row = players.find(r => (r[nameIdx] || '').toString().trim() === playerName);
      if (!row) throw new Error('Player not found');

      const rating = parseFloat(row[ratingIdx]) || 0;
      const rd = parseFloat(row[rdIdx]) || 0;
      const matches = parseInt(row[matchesIdx]) || 0;
      const wins = parseInt(row[winsIdx]) || 0;
      const sumPositions = parseFloat(row[sumPosIdx]) || 0;
      const winRate = matches > 0 ? (wins / matches) * 100 : 0;
      const avgPosition = matches > 0 ? sumPositions / matches : 0;

      let sos = 0;
      try {
        const recentOpp = JSON.parse(row[recentOppIdx] || '[]');
        sos = recentOpp.length > 0 ? recentOpp.reduce((a, b) => a + b, 0) / recentOpp.length : 0;
      } catch (e) {}

      return { rating, rd, winRate, avgPosition, sos };
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
