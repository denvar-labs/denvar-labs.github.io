<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Comparison – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .comparison-setup { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .player-selector { flex: 1; min-width: 200px; }
    .player-selector select { width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); }
    .chart-container { max-width: 700px; margin: 20px auto; }
    .stats-table { margin-top: 20px; }
    .stats-table th { background: var(--accent); color: #fff; padding: 8px 12px; }
    .stats-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Player Comparison</h1>
      <p>Compare up to 4 active players. Leave empty any field you don't need.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="comparison-setup">
            <div class="player-selector">
              <label>Player 1</label>
              <select id="player1-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 2</label>
              <select id="player2-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 3</label>
              <select id="player3-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 4</label>
              <select id="player4-select"><option value="">-- Choose --</option></select>
            </div>
          </div>
          <div id="comparison-content">
            <p>Select at least two players to compare.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/api-loader.js"></script>
  <script>
    let radarChart = null;

    async function init() {
      const names = await fetchPlayerNames(); // only active
      const selectIds = ['player1-select', 'player2-select', 'player3-select', 'player4-select'];
      selectIds.forEach(id => {
        populateSelectFromList(id, names, '-- Choose --');
        document.getElementById(id).addEventListener('change', compare);
      });
    }

    async function compare() {
      const container = document.getElementById('comparison-content');
      const selects = ['player1-select', 'player2-select', 'player3-select', 'player4-select'];
      const chosen = selects.map(id => document.getElementById(id).value).filter(Boolean);

      if (chosen.length < 2) {
        container.innerHTML = '<p>Select at least two players.</p>';
        if (radarChart) { radarChart.destroy(); radarChart = null; }
        return;
      }

      // Ensure no duplicates
      if (new Set(chosen).size !== chosen.length) {
        container.innerHTML = '<p>Please select different players.</p>';
        return;
      }

      container.innerHTML = '<p>Loading comparison…</p>';

      try {
        const inactiveNames = await getInactivePlayerNames();
        // Security: block if any selected player is inactive (should not happen via dropdown)
        if (chosen.some(name => inactiveNames.has(name))) {
          container.innerHTML = '<p>One of the selected players is inactive and cannot be compared.</p>';
          return;
        }

        const statsPromises = chosen.map(name => getPlayerStats(name));
        const playersData = await Promise.all(statsPromises);

        // Metrics: rating, rd (inverted), volatility (inverted), winRate, avgPosition (inverted), sos
        const metrics = {
          rating: { label: 'Rating', better: 'high' },
          rd: { label: 'Consistency (RD inv)', better: 'high' },        // lower RD is better -> invert
          volatility: { label: 'Stability (Vol inv)', better: 'high' }, // lower vol is better -> invert
          winRate: { label: 'Win Rate %', better: 'high' },
          avgPosition: { label: 'Avg Pos (inv)', better: 'high' },     // lower position is better -> invert
          sos: { label: 'SOS', better: 'high' }
        };

        // Build data for radar: normalize each metric to 0-100 within the group
        const radarLabels = Object.values(metrics).map(m => m.label);
        const datasets = [];

        // Collect raw values for normalization
        const rawValues = {};
        radarLabels.forEach(label => rawValues[label] = []);
        playersData.forEach(p => {
          rawValues['Rating'].push(p.rating);
          rawValues['Consistency (RD inv)'].push(p.rd);
          rawValues['Stability (Vol inv)'].push(p.volatility);
          rawValues['Win Rate %'].push(p.winRate);
          rawValues['Avg Pos (inv)'].push(p.avgPosition);
          rawValues['SOS'].push(p.sos);
        });

        // Compute min/max for each metric
        const ranges = {};
        radarLabels.forEach(label => {
          const values = rawValues[label];
          const min = Math.min(...values);
          const max = Math.max(...values);
          ranges[label] = { min, max, range: max - min || 1 };
        });

        // For each player, build normalized radar values
        playersData.forEach((p, idx) => {
          const normValues = radarLabels.map(label => {
            let raw;
            if (label === 'Rating') raw = p.rating;
            else if (label === 'Consistency (RD inv)') raw = p.rd;
            else if (label === 'Stability (Vol inv)') raw = p.volatility;
            else if (label === 'Win Rate %') raw = p.winRate;
            else if (label === 'Avg Pos (inv)') raw = p.avgPosition;
            else if (label === 'SOS') raw = p.sos;

            // Invert metrics where lower is better
            if (label === 'Consistency (RD inv)' || label === 'Stability (Vol inv)' || label === 'Avg Pos (inv)') {
              const { min, max, range } = ranges[label];
              if (range === 0) return 100; // all same -> perfect
              return ((max - raw) / range) * 100; // invert: higher = better
            } else {
              const { min, max, range } = ranges[label];
              if (range === 0) return 100;
              return ((raw - min) / range) * 100;
            }
          });

          const colors = ['#4a86e8', '#e94560', '#10b981', '#f59e0b'];
          datasets.push({
            label: chosen[idx],
            data: normValues,
            borderColor: colors[idx % colors.length],
            backgroundColor: colors[idx % colors.length] + '66',
            pointBackgroundColor: colors[idx % colors.length],
            tension: 0.1
          });
        });

        // Build table
        let tableHtml = '<div class="stats-table"><table class="data-table"><thead><tr><th>Player</th><th>Rating</th><th>RD</th><th>Vol</th><th>Win%</th><th>Avg Pos</th><th>SOS</th></tr></thead><tbody>';
        playersData.forEach((p, i) => {
          tableHtml += `<tr><td>${chosen[i]}</td><td>${p.rating.toFixed(2)}</td><td>${p.rd.toFixed(2)}</td><td>${p.volatility.toFixed(4)}</td><td>${p.winRate.toFixed(1)}%</td><td>${p.avgPosition.toFixed(2)}</td><td>${p.sos.toFixed(0)}</td></tr>`;
        });
        tableHtml += '</tbody></table></div>';

        container.innerHTML = `
          <div class="chart-container">
            <canvas id="radarChart" width="500" height="500"></canvas>
          </div>
          ${tableHtml}
        `;

        const ctx = document.getElementById('radarChart').getContext('2d');
        if (radarChart) radarChart.destroy();
        radarChart = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: radarLabels,
            datasets: datasets
          },
          options: {
            responsive: true,
            scales: {
              r: {
                beginAtZero: true,
                max: 100,
                ticks: { display: false }
              }
            },
            plugins: {
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const raw = playersData[ctx.datasetIndex];
                    const label = ctx.label;
                    if (label === 'Rating') return `${chosen[ctx.datasetIndex]}: ${raw.rating.toFixed(2)}`;
                    if (label === 'Consistency (RD inv)') return `${chosen[ctx.datasetIndex]}: ${raw.rd.toFixed(2)}`;
                    if (label === 'Stability (Vol inv)') return `${chosen[ctx.datasetIndex]}: ${raw.volatility.toFixed(4)}`;
                    if (label === 'Win Rate %') return `${chosen[ctx.datasetIndex]}: ${raw.winRate.toFixed(1)}%`;
                    if (label === 'Avg Pos (inv)') return `${chosen[ctx.datasetIndex]}: ${raw.avgPosition.toFixed(2)}`;
                    if (label === 'SOS') return `${chosen[ctx.datasetIndex]}: ${raw.sos.toFixed(0)}`;
                    return '';
                  }
                }
              }
            }
          }
        });
      } catch (err) {
        container.innerHTML = `<p>Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    async function getPlayerStats(playerName) {
      const players = await fetchSheetData('PLAYERS');
      const header = players[0].map(h => (h || '').toString().trim());
      const nameIdx = header.indexOf('Name');
      const ratingIdx = header.indexOf('Rating');
      const rdIdx = header.indexOf('RD');
      const volIdx = header.indexOf('Volatility');
      const matchesIdx = header.indexOf('Matches');
      const winsIdx = header.indexOf('Wins');
      const sumPosIdx = header.indexOf('SumPositions');
      const recentOppIdx = header.indexOf('RecentOpponents');

      const row = players.find(r => (r[nameIdx] || '').toString().trim() === playerName);
      if (!row) throw new Error('Player not found');

      const rating = parseFloat(row[ratingIdx]) || 0;
      const rd = parseFloat(row[rdIdx]) || 0;
      const volatility = parseFloat(row[volIdx]) || 0;
      const matches = parseInt(row[matchesIdx]) || 0;
      const wins = parseInt(row[winsIdx]) || 0;
      const sumPositions = parseFloat(row[sumPosIdx]) || 0;
      const winRate = matches > 0 ? (wins / matches) * 100 : 0;
      const avgPosition = matches > 0 ? sumPositions / matches : 0;

      let sos = 0;
      try {
        const recentOpp = JSON.parse(row[recentOppIdx] || '[]');
        sos = recentOpp.length > 0 ? recentOpp.reduce((a, b) => a + b, 0) / recentOpp.length : 0;
      } catch (e) {}

      return { rating, rd, volatility, matches, wins, winRate, avgPosition, sos };
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
