<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Comparison – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .comparison-setup { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .player-selector { flex: 1; min-width: 200px; }
    .player-selector select { width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); }
    .radar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }
    .radar-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .radar-card h4 { text-align: center; margin: 0 0 8px; color: var(--accent); font-size: 0.95rem; }
    .player-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
    .player-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .player-card h3 { margin-top: 0; }
    .stat-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .stat-label { color: var(--text-muted); }
    .stat-value { font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Player Comparison</h1>
      <p>Compare up to 4 active players. One radar per metric for clear comparison.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="comparison-setup">
            <div class="player-selector">
              <label>Player 1</label>
              <select id="player1-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 2</label>
              <select id="player2-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 3</label>
              <select id="player3-select"><option value="">-- Choose --</option></select>
            </div>
            <div class="player-selector">
              <label>Player 4</label>
              <select id="player4-select"><option value="">-- Choose --</option></select>
            </div>
          </div>
          <div id="comparison-content">
            <p>Select at least two players to compare.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/api-loader.js"></script>
  <script>
    const chartInstances = [];

    function destroyAllCharts() {
      chartInstances.forEach(c => c.destroy());
      chartInstances.length = 0;
    }

    async function init() {
      const names = await fetchPlayerNames();
      for (let i = 1; i <= 4; i++) {
        populateSelectFromList(`player${i}-select`, names, '-- Choose --');
        document.getElementById(`player${i}-select`).addEventListener('change', compare);
      }
    }

    async function compare() {
      const container = document.getElementById('comparison-content');
      const chosen = [];
      for (let i = 1; i <= 4; i++) {
        const sel = document.getElementById(`player${i}-select`).value;
        if (sel) chosen.push(sel);
      }

      if (chosen.length < 2) {
        container.innerHTML = '<p>Select at least two players.</p>';
        destroyAllCharts();
        return;
      }
      if (new Set(chosen).size !== chosen.length) {
        container.innerHTML = '<p>Please select different players.</p>';
        return;
      }

      container.innerHTML = '<p>Loading comparison…</p>';

      try {
        const inactiveNames = await getInactivePlayerNames();
        if (chosen.some(name => inactiveNames.has(name))) {
          container.innerHTML = '<p>One of the selected players is inactive.</p>';
          return;
        }

        const playersData = await Promise.all(chosen.map(name => getPlayerStats(name)));

        // Build player cards
        let cardsHtml = '<div class="player-cards">';
        playersData.forEach((p, idx) => {
          cardsHtml += `
            <div class="player-card">
              <h3>${chosen[idx]}</h3>
              <div class="stat-row"><span class="stat-label">Rating</span><span class="stat-value">${p.rating.toFixed(2)}</span></div>
              <div class="stat-row"><span class="stat-label">RD</span><span class="stat-value">${p.rd.toFixed(2)}</span></div>
              <div class="stat-row"><span class="stat-label">Win Rate</span><span class="stat-value">${p.winRate.toFixed(1)}%</span></div>
              <div class="stat-row"><span class="stat-label">Avg Position</span><span class="stat-value">${p.avgPosition.toFixed(2)}</span></div>
              <div class="stat-row"><span class="stat-label">SOS</span><span class="stat-value">${p.sos.toFixed(0)}</span></div>
            </div>`;
        });
        cardsHtml += '</div>';

        // Generate radars HTML
        let radarsHtml = '<div class="radar-grid" id="radar-grid"></div>';

        container.innerHTML = radarsHtml + cardsHtml;

        // Prepare metrics
        const metrics = [
          { key: 'rating', label: 'Rating' },
          { key: 'rd', label: 'RD' },
          { key: 'winRate', label: 'Win Rate %' },
          { key: 'avgPosition', label: 'Avg Position' },
          { key: 'sos', label: 'SOS' }
        ];

        const colors = ['#4a86e8', '#e94560', '#10b981', '#f59e0b'];
        const grid = document.getElementById('radar-grid');

        destroyAllCharts();

        // Create one radar per metric
        metrics.forEach(metric => {
          const card = document.createElement('div');
          card.className = 'radar-card';
          card.innerHTML = `<h4>${metric.label}</h4><canvas id="radar-${metric.key}" width="250" height="250"></canvas>`;
          grid.appendChild(card);

          const ctx = document.getElementById(`radar-${metric.key}`).getContext('2d');
          const labels = chosen; // each player is an axis

          // Determine max value for this metric to set radar scale
          const values = playersData.map(p => p[metric.key]);
          const maxVal = Math.max(...values) * 1.1 || 1;

          const datasets = playersData.map((p, idx) => ({
            label: chosen[idx],
            data: [p[metric.key]], // single data point, but radar needs array per player with same length as labels? Actually for radar with multiple axes, each dataset should have one value per axis. We have N axes (players) and one dataset per player. Each dataset will have a single value (the metric value), but repeated for each axis? No: in a radar chart, the number of axes = number of labels. If we have 4 players, we have 4 axes. A dataset represents one player? Wait: we want to compare players across a metric, so each player is a separate dataset, and the axes are the players themselves? That would be a radar with one point per player (the metric value) on the axis representing that player. But then the shape doesn't make sense. Better: use a radar where each axis is a player, and each player's dataset is just a point at its own axis? That's odd.

            // Alternative: for metric radars, we can use a single dataset where each point is the metric value of that player, and the labels are the player names. Then we'd have one dataset (the metric) and the radar would show the metric value for each player. But the user asked for a hexagon per metric, probably meaning a radar chart where you see the metric value for each player, forming a polygon. So each metric radar has one dataset (the metric) with one value per player. The labels are the player names. This makes perfect sense and is clean.

            // I'll implement: each radar has one dataset (the metric) with data = [player1.metric, player2.metric, ...]. The labels are the player names.
          }));

          // Let's do it simpler: one dataset, labels = players, data = metric values.
          const dataValues = playersData.map(p => p[metric.key]);
          const singleDataset = {
            label: metric.label,
            data: dataValues,
            backgroundColor: colors.map(c => c + '44'),
            borderColor: colors.map(c => c),
            borderWidth: 2,
            pointBackgroundColor: colors,
            pointRadius: 5
          };

          new Chart(ctx, {
            type: 'radar',
            data: {
              labels: chosen,
              datasets: [singleDataset]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              scales: {
                r: {
                  beginAtZero: true,
                  max: maxVal,
                  ticks: { display: false }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => {
                      const raw = ctx.raw;
                      if (metric.key === 'winRate') return `${ctx.label}: ${raw.toFixed(1)}%`;
                      if (metric.key === 'rating' || metric.key === 'rd' || metric.key === 'avgPosition') return `${ctx.label}: ${raw.toFixed(2)}`;
                      return `${ctx.label}: ${raw.toFixed(0)}`;
                    }
                  }
                }
              }
            }
          });
          chartInstances.push(this); // will be replaced by correct reference below
        });
      } catch (err) {
        container.innerHTML = `<p>Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    async function getPlayerStats(playerName) {
      const players = await fetchSheetData('PLAYERS');
      const header = players[0].map(h => (h || '').toString().trim());
      const nameIdx = header.indexOf('Name');
      const ratingIdx = header.indexOf('Rating');
      const rdIdx = header.indexOf('RD');
      const volIdx = header.indexOf('Volatility');
      const matchesIdx = header.indexOf('Matches');
      const winsIdx = header.indexOf('Wins');
      const sumPosIdx = header.indexOf('SumPositions');
      const recentOppIdx = header.indexOf('RecentOpponents');

      const row = players.find(r => (r[nameIdx] || '').toString().trim() === playerName);
      if (!row) throw new Error('Player not found');

      const rating = parseFloat(row[ratingIdx]) || 0;
      const rd = parseFloat(row[rdIdx]) || 0;
      const volatility = parseFloat(row[volIdx]) || 0;
      const matches = parseInt(row[matchesIdx]) || 0;
      const wins = parseInt(row[winsIdx]) || 0;
      const sumPositions = parseFloat(row[sumPosIdx]) || 0;
      const winRate = matches > 0 ? (wins / matches) * 100 : 0;
      const avgPosition = matches > 0 ? sumPositions / matches : 0;

      let sos = 0;
      try {
        const recentOpp = JSON.parse(row[recentOppIdx] || '[]');
        sos = recentOpp.length > 0 ? recentOpp.reduce((a, b) => a + b, 0) / recentOpp.length : 0;
      } catch (e) {}

      return { rating, rd, volatility, matches, wins, winRate, avgPosition, sos };
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
