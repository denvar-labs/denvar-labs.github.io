<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matches – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">Matches</div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/header.js"></script>
  <script>
    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        title: 'Match History',
        description: 'All matches processed by the system.'
      });
    }
    function initMatches() { loadTableFromSheet('MATCHES', 'data-table', -1); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMatches);
    } else {
      initMatches();
    }
  </script>
</body>
</html>
