<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Streams – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .stream-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .stream-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .stream-card iframe { width: 100%; height: 200px; border: 0; }
    .stream-info { padding: 12px; }
    .stream-name { font-size: 1.1rem; font-weight: 700; }
    .stream-platform { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .stream-link { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Live Streams & Content</h1>
      <p>Watch Mario Kart 64 action from our community streamers.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">🔴 Community Channels</div>
          <div class="stream-grid" id="streams-container">
            <!-- Filled by JavaScript -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    // Channels data
    const channels = [
      {
        name: "Grey0__",
        platform: "Twitch",
        type: "twitch",
        id: "grey0__",
        url: "https://www.twitch.tv/grey0__"
      },
      {
        name: "fx6400",
        platform: "Twitch",
        type: "twitch",
        id: "fx6400",
        url: "https://www.twitch.tv/fx6400"
      },
      {
        name: "devarsc",
        platform: "Twitch",
        type: "twitch",
        id: "denvarsc",
        url: "https://www.twitch.tv/denvarsc"
      },
      {
        name: "Red Buffalo",
        platform: "YouTube",
        type: "youtube",
        id: "@redbuffalo2170",
        url: "https://www.youtube.com/@redbuffalo2170"
      },
      {
        name: "El Super Cien",
        platform: "YouTube",
        type: "youtube",
        id: "@ElSuperCien",
        url: "https://www.youtube.com/@ElSuperCien"
      }
    ];

    function renderStreams() {
      const container = document.getElementById("streams-container");
      let html = "";

      channels.forEach(ch => {
        if (ch.type === "twitch") {
          // Twitch embed
          html += `
            <div class="stream-card">
              <iframe
                src="https://player.twitch.tv/?channel=${ch.id}&parent=denvar-labs.github.io&muted=true"
                allowfullscreen="true"
                scrolling="no">
              </iframe>
              <div class="stream-info">
                <div class="stream-name">${ch.name}</div>
                <div class="stream-platform">Twitch</div>
                <a href="${ch.url}" target="_blank" rel="noopener" class="stream-link">Open channel ↗</a>
              </div>
            </div>
          `;
        } else if (ch.type === "youtube") {
          // YouTube: embed latest videos playlist
          html += `
            <div class="stream-card">
              <iframe
                src="https://www.youtube.com/embed?listType=user_uploads&list=${ch.id}"
                allowfullscreen="true"
                scrolling="no">
              </iframe>
              <div class="stream-info">
                <div class="stream-name">${ch.name}</div>
                <div class="stream-platform">YouTube</div>
                <a href="${ch.url}" target="_blank" rel="noopener" class="stream-link">Open channel ↗</a>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;
    }

    document.addEventListener("DOMContentLoaded", renderStreams);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
