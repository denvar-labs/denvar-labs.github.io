<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Streams – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .stream-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .stream-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .stream-card iframe { width: 100%; height: 200px; border: 0; }
    .stream-info { padding: 12px; }
    .stream-name { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .live-badge { background: #10b981; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .offline-text { font-size: 0.85rem; color: var(--text-muted); }
    .viewers { font-size: 0.8rem; color: #10b981; margin-left: 4px; }
    .live-title { font-size: 0.85rem; color: var(--text-muted); margin: 4px 0; }
    .stream-platform { font-size: 0.85rem; color: var(--text-muted); }
    .stream-link { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Live Streams & Content</h1>
      <p>Community streamers. Green badge = LIVE now. Live streams appear first.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">🔴 Community Channels</div>
          <div class="stream-grid" id="streams-container">
            Loading streams…
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    // ===== CONFIGURACIÓN =====
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyVBjLSCxunlwsHt2Ou_grlUMUte5Z_J1t5tOICLkVknmMyIwz5HPmQxEO0yJRhuDLY/exec'; // ← tu URL real

    const channels = [
      { name: "Grey0__", plat: "Twitch", type: "twitch", id: "grey0__", url: "https://www.twitch.tv/grey0__" },
      { name: "fx6400", plat: "Twitch", type: "twitch", id: "fx6400", url: "https://www.twitch.tv/fx6400" },
      { name: "devarsc", plat: "Twitch", type: "twitch", id: "denvarsc", url: "https://www.twitch.tv/denvarsc" },
      { name: "Red Buffalo", plat: "YouTube", type: "yt", handle: "@redbuffalo2170", url: "https://www.youtube.com/@redbuffalo2170" },
      { name: "El Super Cien", plat: "YouTube", type: "yt", handle: "@ElSuperCien", url: "https://www.youtube.com/@ElSuperCien" },
      { name: "Vena Monterrey", plat: "YouTube", type: "yt", handle: "@venamonterrey3957", url: "https://www.youtube.com/@venamonterrey3957" },
      { name: "Cheech", plat: "YouTube", type: "yt", handle: "@Cheech331", url: "https://www.youtube.com/@Cheech331" },
      { name: "Skedar", plat: "YouTube", type: "yt", handle: "@DavidSkedarWarrior", url: "https://www.youtube.com/@DavidSkedarWarrior" },
      { name: "Andrew MK64", plat: "YouTube", type: "yt", handle: "@andrewMK64", url: "https://www.youtube.com/@andrewMK64" },
      { name: "Tom (Wormkiller007)", plat: "YouTube", type: "yt", handle: "@Wormkiller007", url: "https://www.youtube.com/@Wormkiller007" },
      { name: "Yale", plat: "YouTube", type: "yt", handle: "@youngYale", url: "https://www.youtube.com/@youngYale" },
      { name: "Justase", plat: "YouTube", type: "yt", handle: "@justase64", url: "https://www.youtube.com/@justase64" },
      { name: "Velizer0", plat: "YouTube", type: "yt", handle: "@velizer0", url: "https://www.youtube.com/@velizer0" }
    ];

    async function getLiveData() {
      const twNames = channels.filter(c => c.type === 'twitch').map(c => c.id).join(',');
      const ytNames = channels.filter(c => c.type === 'yt').map(c => c.handle).join(',');
      const url = `${SCRIPT_URL}?action=live&tw=${encodeURIComponent(twNames)}&yt=${encodeURIComponent(ytNames)}`;
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        return data;
      } catch (err) {
        console.error('Live check failed', err);
        return { tw: {}, yt: {} };
      }
    }

    async function render() {
      const container = document.getElementById('streams-container');
      container.innerHTML = 'Checking live status…';
      const live = await getLiveData();

      // Attach live info
      channels.forEach(ch => {
        if (ch.type === 'twitch') {
          const info = live.tw[ch.id] || {};
          ch.isLive = info.isLive || false;
          ch.viewers = info.viewers || 0;
          ch.liveTitle = info.title || '';
        } else {
          const info = live.yt[ch.handle] || {};
          ch.isLive = info.isLive || false;
          ch.liveVideoId = info.videoId || null;
          ch.liveTitle = info.title || '';
        }
      });

      // Sort: live first, then Twitch before YouTube, then alphabetical
      channels.sort((a, b) => {
        if (a.isLive && !b.isLive) return -1;
        if (!a.isLive && b.isLive) return 1;
        if (a.type === 'twitch' && b.type === 'yt') return -1;
        if (a.type === 'yt' && b.type === 'twitch') return 1;
        return a.name.localeCompare(b.name);
      });

      let html = '';
      channels.forEach(ch => {
        const liveBadge = ch.isLive ? '<span class="live-badge">LIVE</span>' : '<span class="offline-text">(Offline)</span>';
        const viewers = ch.isLive && ch.viewers ? `<span class="viewers">${ch.viewers} viewers</span>` : '';
        const titleLine = ch.isLive && ch.liveTitle ? `<div class="live-title">${ch.liveTitle}</div>` : '';

        if (ch.type === 'twitch') {
          html += `
            <div class="stream-card">
              <iframe src="https://player.twitch.tv/?channel=${ch.id}&parent=denvar-labs.github.io&muted=true" allowfullscreen scrolling="no"></iframe>
              <div class="stream-info">
                <div class="stream-name">${ch.name} ${liveBadge}${viewers}</div>
                ${titleLine}
                <div class="stream-platform">Twitch</div>
                <a href="${ch.url}" target="_blank" rel="noopener" class="stream-link">Open channel ↗</a>
              </div>
            </div>`;
        } else {
          const embedSrc = ch.isLive && ch.liveVideoId
            ? `https://www.youtube.com/embed/${ch.liveVideoId}`
            : `https://www.youtube.com/embed?listType=user_uploads&list=${ch.handle}`;
          html += `
            <div class="stream-card">
              <iframe src="${embedSrc}" allowfullscreen scrolling="no"></iframe>
              <div class="stream-info">
                <div class="stream-name">${ch.name} ${liveBadge}</div>
                ${titleLine}
                <div class="stream-platform">YouTube</div>
                <a href="${ch.isLive ? 'https://www.youtube.com/watch?v=' + ch.liveVideoId : ch.url}" target="_blank" rel="noopener" class="stream-link">
                  ${ch.isLive ? 'Watch live ↗' : 'Open channel ↗'}
                </a>
              </div>
            </div>`;
        }
      });
      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', render);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
