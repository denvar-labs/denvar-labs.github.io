<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalties – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">Penalty History</div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/header.js"></script>
  <script src="../js/ui/lang-switcher.js"></script>
  <script>
    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_penalties',
        descKey: 'desc_penalties'
      });
    }
    if (typeof LangSwitcher !== 'undefined') {
      LangSwitcher.create('lang-switcher-container');
      if (typeof I18n !== 'undefined') I18n.translatePage();
    }
    function initPenalties() { loadTableFromSheet('PENALTIES', 'data-table', -1); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPenalties);
    } else {
      initPenalties();
    }

  </script>
</body>
</html>
