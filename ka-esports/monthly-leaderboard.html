<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Leaderboard – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="month-select">Season:</label>
            <select id="month-select" class="field-select">
              <option value="">-- Choose a month --</option>
            </select>
          </div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/header.js"></script>
  <script src="../js/ui/lang-switcher.js"></script>
  <script src="../js/ui/exports.js"></script>
  <script src="../js/ui/column-resize.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    function getMonthPrefix() {
      const params = new URLSearchParams(window.location.search);
      return params.get('month') || 'current';
    }

    function initPage() {
      // Inject page header
      if (typeof PageHeader !== 'undefined') {
        PageHeader.inject('page-header', {
          titleKey: 'title_monthly_leaderboard',
          descKey: 'desc_monthly_leaderboard',
          actions: [
            { id: 'screenshot-btn', icon: '📸', labelKey: 'btn_screenshot', ariaLabel: 'Download high-res screenshot of table' },
            { id: 'csv-btn', icon: '📥', labelKey: 'btn_csv', ariaLabel: 'Download table as CSV' }
          ]
        });
      }

      // Bind export buttons
      document.getElementById('csv-btn')?.addEventListener('click', () => {
        ExportUtils.exportCSV('data-table', `monthly-leaderboard-${getMonthPrefix()}-{date}.csv`);
      });
      document.getElementById('screenshot-btn')?.addEventListener('click', () => {
        ExportUtils.exportScreenshot('data-table', `monthly-leaderboard-${getMonthPrefix()}-{date}.png`, document.getElementById('screenshot-btn'));
      });

      // Init table data
      init();
    }

    async function loadMonth(sheetName) {
      await loadTableFromSheet(sheetName, 'data-table');
      const monthParam = sheetName.replace('LEADERBOARD_', '');
      const newUrl = window.location.pathname + '?month=' + monthParam;
      history.replaceState(null, '', newUrl);
    }

    async function init() {
      await populateMonthSelector('month-select', 'LEADERBOARD_');

      const params = new URLSearchParams(window.location.search);
      const monthParam = params.get('month');
      if (monthParam) {
        const sheetName = 'LEADERBOARD_' + monthParam;
        document.getElementById('month-select').value = sheetName;
        loadMonth(sheetName);
      }

      document.getElementById('month-select').addEventListener('change', e => {
        if (e.target.value) {
          loadMonth(e.target.value);
        } else {
          const tbody = document.querySelector('#data-table tbody');
          renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
          history.replaceState(null, '', window.location.pathname);
        }
      });

      if (!monthParam) {
        const tbody = document.querySelector('#data-table tbody');
        renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }

    // Table enhance
    (function () {
      const script = document.createElement('script');
      script.src = '../js/table-enhance.js';
      script.onload = () => {
        new TableEnhance('data-table').init({
          sortable: true,
          filterable: true,
          filterPlaceholder: 'Search players...',
          columnPicker: true,
          deepLink: true
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
