<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Leaderboard – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Monthly Leaderboard</h1>
      <p>Select a season to view its leaderboard. The URL updates automatically so you can share a direct link.</p>
      <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <button id="dark-toggle-btn" class="retry-btn" style="padding: 6px 12px; font-size: 0.85rem;" aria-label="Toggle dark mode">
          <span id="dark-label">🌙 Dark mode</span>
        </button>
      </div>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="month-select">Season:</label>
            <select id="month-select" class="field-select">
              <option value="">-- Choose a month --</option>
            </select>
          </div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script>
    async function loadMonth(sheetName) {
      await loadTableFromSheet(sheetName, 'data-table');
      const monthParam = sheetName.replace('LEADERBOARD_', '');
      const newUrl = window.location.pathname + '?month=' + monthParam;
      history.replaceState(null, '', newUrl);
    }

    async function init() {
      await populateMonthSelector('month-select', 'LEADERBOARD_');

      const params = new URLSearchParams(window.location.search);
      const monthParam = params.get('month');
      if (monthParam) {
        const sheetName = 'LEADERBOARD_' + monthParam;
        document.getElementById('month-select').value = sheetName;
        loadMonth(sheetName);
      }

      document.getElementById('month-select').addEventListener('change', e => {
        if (e.target.value) {
          loadMonth(e.target.value);
        } else {
          const tbody = document.querySelector('#data-table tbody');
          renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
          history.replaceState(null, '', window.location.pathname);
        }
      });

      if (!monthParam) {
        const tbody = document.querySelector('#data-table tbody');
        renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
      }
    }

    document.addEventListener('DOMContentLoaded', init);
    (function () {
      function applyDark(on) {
        document.body.classList.toggle('dark', on);
        const label = document.getElementById('dark-label');
        if (label) label.textContent = on ? '☀️ Light mode' : '🌙 Dark mode';
      }
      const saved = localStorage.getItem('ka_dark_mode');
      if (saved === 'true') applyDark(true);
      const btn = document.getElementById('dark-toggle-btn');
      if (btn) btn.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        applyDark(!isDark);
        localStorage.setItem('ka_dark_mode', !isDark);
      });
    })();
  </script>
</body>
</html>
