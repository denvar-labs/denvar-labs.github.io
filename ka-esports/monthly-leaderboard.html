<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Leaderboard – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Monthly Leaderboard</h1>
      <p>Select a season to view its leaderboard. The URL updates automatically so you can share a direct link.</p>
      <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <button id="screenshot-btn" class="retry-btn" style="padding: 6px 12px; font-size: 0.85rem;" aria-label="Download high-res screenshot of table">
          <span>📸 Screenshot</span>
        </button>
        <button id="csv-btn" class="retry-btn" style="padding: 6px 12px; font-size: 0.85rem;" aria-label="Download table as CSV">
          <span>📥 CSV</span>
        </button>
        <button id="dark-toggle-btn" class="retry-btn" style="padding: 6px 12px; font-size: 0.85rem;" aria-label="Toggle dark mode">
          <span id="dark-label">🌙 Dark mode</span>
        </button>
      </div>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="month-select">Season:</label>
            <select id="month-select" class="field-select">
              <option value="">-- Choose a month --</option>
            </select>
          </div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    async function loadMonth(sheetName) {
      await loadTableFromSheet(sheetName, 'data-table');
      const monthParam = sheetName.replace('LEADERBOARD_', '');
      const newUrl = window.location.pathname + '?month=' + monthParam;
      history.replaceState(null, '', newUrl);
    }

    async function init() {
      await populateMonthSelector('month-select', 'LEADERBOARD_');

      const params = new URLSearchParams(window.location.search);
      const monthParam = params.get('month');
      if (monthParam) {
        const sheetName = 'LEADERBOARD_' + monthParam;
        document.getElementById('month-select').value = sheetName;
        loadMonth(sheetName);
      }

      document.getElementById('month-select').addEventListener('change', e => {
        if (e.target.value) {
          loadMonth(e.target.value);
        } else {
          const tbody = document.querySelector('#data-table tbody');
          renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
          history.replaceState(null, '', window.location.pathname);
        }
      });

      if (!monthParam) {
        const tbody = document.querySelector('#data-table tbody');
        renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
      }
    }

    document.addEventListener('DOMContentLoaded', init);
    (function () {
      function applyDark(on) {
        document.body.classList.toggle('dark', on);
        const label = document.getElementById('dark-label');
        if (label) label.textContent = on ? '☀️ Light mode' : '🌙 Dark mode';
      }
      const saved = localStorage.getItem('ka_dark_mode');
      if (saved === 'true') applyDark(true);
      const btn = document.getElementById('dark-toggle-btn');
      if (btn) btn.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        applyDark(!isDark);
        localStorage.setItem('ka_dark_mode', !isDark);
      });
    })();

    // Screenshot functionality
    (function () {
      const btn = document.getElementById('screenshot-btn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const table = document.getElementById('data-table');
        if (!table || !table.querySelector('thead th')) {
          alert('Table not loaded yet. Please select a month and wait for data to load.');
          return;
        }
        btn.disabled = true;
        btn.innerHTML = '<span>⏳ Generating...</span>';
        try {
          const wrapper = document.querySelector('.table-responsive');
          const originalOverflow = wrapper ? wrapper.style.overflow : '';
          if (wrapper) wrapper.style.overflow = 'visible';
          const originalScrollX = window.scrollX;
          const originalScrollY = window.scrollY;
          window.scrollTo(0, 0);
          const canvas = await html2canvas(table, {
            scale: 3,
            useCORS: true,
            logging: false,
            backgroundColor: getComputedStyle(document.body).backgroundColor,
            width: table.scrollWidth,
            height: table.scrollHeight,
            windowWidth: table.scrollWidth,
            windowHeight: table.scrollHeight
          });
          if (wrapper) wrapper.style.overflow = originalOverflow;
          window.scrollTo(originalScrollX, originalScrollY);
          const params = new URLSearchParams(window.location.search);
          const monthParam = params.get('month') || 'current';
          const dateStr = new Date().toISOString().split('T')[0];
          const link = document.createElement('a');
          link.download = `monthly-leaderboard-${monthParam}-${dateStr}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        } catch (err) {
          console.error('Screenshot failed:', err);
          showToast('Failed to generate screenshot. See console for details.', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<span>📸 Screenshot</span>';
        }
      });
    })();

    // CSV export functionality
    (function () {
      const btn = document.getElementById('csv-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        const table = document.getElementById('data-table');
        if (!table || !table.querySelector('thead th')) {
          showToast('Table not loaded yet. Please select a month and wait for data to load.', 'error');
          return;
        }
        const rows = table.querySelectorAll('tr');
        const csv = Array.from(rows).map(row =>
          Array.from(row.querySelectorAll('th,td')).map(cell =>
            '"' + cell.textContent.replace(/"/g, '""') + '"'
          ).join(',')
        ).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        const params = new URLSearchParams(window.location.search);
        const monthParam = params.get('month') || 'current';
        const dateStr = new Date().toISOString().split('T')[0];
        link.download = `monthly-leaderboard-${monthParam}-${dateStr}.csv`;
        link.click();
        showToast('CSV downloaded successfully', 'success');
      });
    })();

    // Table enhance: sort, filter, column picker, deep links
    (function () {
      const script = document.createElement('script');
      script.src = '../js/table-enhance.js';
      script.onload = () => {
        new TableEnhance('data-table').init({
          sortable: true,
          filterable: true,
          filterPlaceholder: 'Search players...',
          columnPicker: true,
          deepLink: true
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
