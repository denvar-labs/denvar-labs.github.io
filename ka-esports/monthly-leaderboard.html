<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Monthly Leaderboard – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/esports.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="Select a season to view its leaderboard. The URL updates automatically for sharing.">
  <meta property="og:title" content="Monthly Leaderboard – KA ESPORTS">
  <meta property="og:description" content="Select a season to view its leaderboard. The URL updates automatically for sharing.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/monthly-leaderboard.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Monthly Leaderboard – KA ESPORTS">
  <meta name="twitter:description" content="Select a season to view its leaderboard. The URL updates automatically for sharing.">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <span data-i18n="monthly_leaderboard">Monthly Leaderboard</span>
            <div class="season-filter-group">
              <label for="month-select" data-i18n="season">Season:</label>
              <select id="month-select" class="field-select">
                <option value="" data-i18n="choose_month">-- Choose a month --</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/toast-advanced.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>
  <script src="../js/ui/follow.js"></script>

  <script src="../js/ui/exports.js"></script>
  <script src="../js/ui/column-resize.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script>
    Navbar.inject('navbar-container');

    function getMonthPrefix() {
      const params = new URLSearchParams(window.location.search);
      return params.get('month') || 'current';
    }

    function initPage() {
      // Inject page header
      if (typeof PageHeader !== 'undefined') {
        PageHeader.inject('page-header', {
          titleKey: 'title_monthly_leaderboard',
          descKey: 'desc_monthly_leaderboard',
          actions: [
            { id: 'screenshot-btn', icon: '📸', labelKey: 'btn_screenshot', ariaLabel: 'Download high-res screenshot of table' },
            { id: 'csv-btn', icon: '📥', labelKey: 'btn_csv', ariaLabel: 'Download table as CSV' }
          ]
        });
      }

      // Bind export buttons
      document.getElementById('csv-btn')?.addEventListener('click', () => {
        ExportUtils.exportCSV('data-table', `monthly-leaderboard-${getMonthPrefix()}-{date}.csv`);
      });
      document.getElementById('screenshot-btn')?.addEventListener('click', () => {
        ExportUtils.exportScreenshot('data-table', `monthly-leaderboard-${getMonthPrefix()}-{date}.png`, document.getElementById('screenshot-btn'));
      });

      // Init table data
      init();
    }

    async function loadMonth(sheetName) {
      await loadTableFromSheet(sheetName, 'data-table');
      const monthParam = sheetName.replace('LEADERBOARD_', '');
      const newUrl = window.location.pathname + '?month=' + monthParam;
      history.replaceState(null, '', newUrl);
      addFollowButtonsToTable('data-table');
    }

    function addFollowButtonsToTable(tableId) {
      if (typeof KaFollows === 'undefined') return;
      const table = document.getElementById(tableId);
      if (!table) return;
      table.querySelectorAll('tbody tr').forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length === 0) return;
        const nameCell = cells[0];
        const link = nameCell.querySelector('a');
        if (!link) return;
        const playerName = link.textContent.trim();
        if (!playerName) return;
        if (nameCell.querySelector('.follow-btn')) return;
        const btn = KaFollows.createButton(playerName);
        btn.style.marginLeft = '6px';
        btn.style.verticalAlign = 'middle';
        btn.style.fontSize = '0.85rem';
        btn.style.padding = '2px 5px';
        link.parentNode.insertBefore(btn, link.nextSibling);
      });
    }

    async function init() {
      await populateMonthSelector('month-select', 'LEADERBOARD_');

      const params = new URLSearchParams(window.location.search);
      const monthParam = params.get('month');
      if (monthParam) {
        const sheetName = 'LEADERBOARD_' + monthParam;
        document.getElementById('month-select').value = sheetName;
        loadMonth(sheetName);
      }

      document.getElementById('month-select').addEventListener('change', e => {
        if (e.target.value) {
          loadMonth(e.target.value);
        } else {
          const tbody = document.querySelector('#data-table tbody');
          renderTableState(tbody, 20, 'empty', { title: I18n.t('select_month') });
          history.replaceState(null, '', window.location.pathname);
        }
      });

      if (!monthParam) {
        const tbody = document.querySelector('#data-table tbody');
        renderTableState(tbody, 20, 'empty', { title: 'Select a month to view its leaderboard.' });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPage);
    } else {
      initPage();
    }

    // Table enhance
    (function () {
      const script = document.createElement('script');
      script.src = 'js/table-enhance.js';
      script.onload = () => {
        new TableEnhance('data-table').init({
          sortable: true,
          filterable: true,
          filterPlaceholder: I18n.t('search_players'),
          columnPicker: true,
          deepLink: true
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
