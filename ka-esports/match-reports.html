<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Match Reports – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/esports.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="Select a month to view detailed match reports including points, positions, and rating changes.">
  <meta property="og:title" content="Match Reports – KA ESPORTS">
  <meta property="og:description" content="Select a month to view detailed match reports including points, positions, and rating changes.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/match-reports.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Match Reports – KA ESPORTS">
  <meta name="twitter:description" content="Select a month to view detailed match reports including points, positions, and rating changes.">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="report-select" data-i18n="month">Month:</label>
            <select id="report-select" class="field-select">
              <option value="" data-i18n="choose_month">-- Choose a month --</option>
            </select>
          </div>
          <div id="match-reports-container">
            <div class="state-box state-empty"><div class="state-title" data-i18n="select_month">Select a month to view its match reports.</div></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_match_reports',
        descKey: 'desc_match_reports'
      });
    }

    async function loadMonth(sheetName) {
      await renderMatchReports(sheetName, 'match-reports-container');
      const monthParam = sheetName.replace('MATCH_REPORTS_', '');
      const newUrl = window.location.pathname + '?month=' + monthParam;
      history.replaceState(null, '', newUrl);
    }

    async function init() {
      await populateMonthSelector('report-select', 'MATCH_REPORTS_');

      const params = new URLSearchParams(window.location.search);
      let monthParam = params.get('month');
      if (monthParam) {
        monthParam = monthParam.replace('-', '_');
        const sheetName = 'MATCH_REPORTS_' + monthParam;
        document.getElementById('report-select').value = sheetName;
        loadMonth(sheetName);
      }

      document.getElementById('report-select').addEventListener('change', e => {
        if (e.target.value) {
          loadMonth(e.target.value);
        } else {
          document.getElementById('match-reports-container').innerHTML =
            '<div class="state-box state-empty"><div class="state-title">' + I18n.t('select_month') + '</div></div>';
          history.replaceState(null, '', window.location.pathname);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  </script>
</body>
</html>
