<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Reports – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Match Reports</h1>
      <p>Select a month to view detailed match reports. The URL updates automatically for easy sharing.</p>
      <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <button id="dark-toggle-btn" class="retry-btn" style="padding: 6px 12px; font-size: 0.85rem;" aria-label="Toggle dark mode">
          <span id="dark-label">🌙 Dark mode</span>
        </button>
      </div>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="report-select">Month:</label>
            <select id="report-select" class="field-select">
              <option value="">-- Choose a month --</option>
            </select>
          </div>
          <div id="match-reports-container">
            <div class="state-box state-empty"><div class="state-title">Select a month to view its match reports.</div></div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script>
    async function loadMonth(sheetName) {
      await renderMatchReports(sheetName, 'match-reports-container');
      const monthParam = sheetName.replace('MATCH_REPORTS_', '');
      const newUrl = window.location.pathname + '?month=' + monthParam;
      history.replaceState(null, '', newUrl);
    }

    async function init() {
      await populateMonthSelector('report-select', 'MATCH_REPORTS_');

      const params = new URLSearchParams(window.location.search);
      let monthParam = params.get('month');
      if (monthParam) {
        monthParam = monthParam.replace('-', '_');
        const sheetName = 'MATCH_REPORTS_' + monthParam;
        document.getElementById('report-select').value = sheetName;
        loadMonth(sheetName);
      }

      document.getElementById('report-select').addEventListener('change', e => {
        if (e.target.value) {
          loadMonth(e.target.value);
        } else {
          document.getElementById('match-reports-container').innerHTML =
            '<div class="state-box state-empty"><div class="state-title">Select a month to view its match reports.</div></div>';
          history.replaceState(null, '', window.location.pathname);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
    (function () {
      function applyDark(on) {
        document.body.classList.toggle('dark', on);
        const label = document.getElementById('dark-label');
        if (label) label.textContent = on ? '☀️ Light mode' : '🌙 Dark mode';
      }
      const saved = localStorage.getItem('ka_dark_mode');
      if (saved === 'true') applyDark(true);
      const btn = document.getElementById('dark-toggle-btn');
      if (btn) btn.addEventListener('click', () => {
        const isDark = document.body.classList.contains('dark');
        applyDark(!isDark);
        localStorage.setItem('ka_dark_mode', !isDark);
      });
    })();
  </script>
</body>
</html>
