<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Hall of Fame – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/esports.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
  <style>
    .records-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .record-card { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .record-icon { font-size: 2.5rem; }
    .record-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin: 8px 0 4px; }
    .record-value { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .record-player { font-size: 1rem; color: var(--text); margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .record-flag { font-size: 1.2rem; }
    .mode-switch { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-btn { padding: 8px 16px; border: 2px solid var(--border); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text); }
    .mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chart-container { max-width: 800px; margin: 20px auto; }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="Historical records and all-time greats of KA ESPORTS.">
  <meta property="og:title" content="Hall of Fame – KA ESPORTS">
  <meta property="og:description" content="Historical records and all-time greats of KA ESPORTS.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/hall-of-fame.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hall of Fame – KA ESPORTS">
  <meta name="twitter:description" content="Historical records and all-time greats of KA ESPORTS.">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
<div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="mode-switch" id="mode-switch">
            <button class="mode-btn active" data-mode="alltime"><i class="ph ph-trophy" aria-hidden="true"></i> <span data-i18n="hall-of-fame_alltime">All‑Time</span></button>
            <button class="mode-btn" data-mode="monthly"><i class="ph ph-calendar" aria-hidden="true"></i> <span data-i18n="hall-of-fame_monthly">Monthly</span></button>
          </div>

          <div id="month-selector" style="display:none; margin-bottom:16px;">
            <div class="section-heading" style="margin-bottom:0;">
              <span data-i18n="hall_of_fame_monthly">Monthly Records</span>
              <div class="season-filter-group">
                <label for="hof-month-select" data-i18n="season">Season:</label>
                <select id="hof-month-select" class="field-select">
                  <option value="" data-i18n="choose_month">-- Choose a month --</option>
                </select>
              </div>
            </div>
          </div>

          <div class="records-grid" id="records-container"></div>

          <div class="chart-container" id="chart-section" style="display:none;">
            <canvas id="topChart"></canvas>
            <p style="text-align:center; color:var(--text-muted); margin-top:8px;" id="chart-caption"></p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_hall_of_fame',
        descKey: 'desc_hall_of_fame'
      });
    }

    let currentMode = 'alltime';
    let currentChart = null;

    function getLastCompletedMonth(months) {
      const now = new Date();
      const currentKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const completed = months.filter(m => m < currentKey).sort().reverse();
      return completed.length > 0 ? completed[0] : null;
    }

    function buildRecordCard(icon, title, player, value, flag) {
      const flagHtml = flag ? `<span class="record-flag">${flag}</span>` : '';
      return `<div class="record-card">
        <div class="record-icon">${icon}</div>
        <div class="record-title">${escapeHtml(title)}</div>
        <div class="record-value">${escapeHtml(value)}</div>
        <div class="record-player">${flagHtml}${escapeHtml(player)}</div>
      </div>`;
    }

    function destroyChart() {
      if (currentChart) { currentChart.destroy(); currentChart = null; }
    }

    async function loadAllTimeRecords() {
      const container = document.getElementById('records-container');
      const chartSection = document.getElementById('chart-section');
      const chartCaption = document.getElementById('chart-caption');
      renderState(container, 'loading', { title: 'Loading all-time records...' });
      chartSection.style.display = 'none';
      destroyChart();

      try {
        const data = await fetchSheetData('LEADERBOARD_GLOBAL');
        if (data.length < 4) { renderState(container, 'empty', { title: 'No data available.' }); return; }
        const headers = data[2].map(h => (h || '').toString().trim());
        const nameIdx = headers.indexOf('Player');
        const ratingIdx = headers.indexOf('Rating');
        const rankIdx = headers.indexOf('Rank');
        const matchesIdx = headers.indexOf('Matches');
        const winsIdx = headers.indexOf('Wins');
        const countryIdx = headers.indexOf('Country');
        const volIdx = headers.indexOf('Volatility');

        const inactiveNames = await getInactivePlayerNames();
        const rows = data.slice(3).filter(r => {
          const rank = (r[rankIdx] || '').toString().trim();
          const name = (r[nameIdx] || '').toString().trim();
          return name && rank !== 'Unranked' && !inactiveNames.has(name);
        });

        if (rows.length === 0) { renderState(container, 'empty', { title: 'No ranked active players found.' }); return; }

        const players = rows.map(r => ({
          name: r[nameIdx],
          rating: parseFloat(r[ratingIdx]),
          matches: parseInt(r[matchesIdx]) || 0,
          wins: parseInt(r[winsIdx]) || 0,
          country: (r[countryIdx] || 'XX').toString().trim(),
          volatility: parseFloat(r[volIdx]) || 0
        }));

        const topRating = players.reduce((a, b) => a.rating > b.rating ? a : b);
        const topMatches = players.reduce((a, b) => a.matches > b.matches ? a : b);
        const topWins = players.reduce((a, b) => a.wins > b.wins ? a : b);
        const highWR = players.filter(p => p.matches >= 10).sort((a, b) => (b.wins / b.matches) - (a.wins / a.matches))[0];
        const mostConsistent = players.filter(p => p.matches >= 5).reduce((a, b) => a.volatility < b.volatility ? a : b);

        let mvpCount = {};
        try {
          const allSheets = await fetchSheetList();
          const lbSheets = allSheets.filter(s => s.startsWith('LEADERBOARD_') && s !== 'LEADERBOARD_GLOBAL').sort();
          const allData = await Promise.all(lbSheets.map(s => fetchSheetData(s).catch(() => [])));
          allData.forEach(sData => {
            if (sData.length < 4) return;
            const sHeaders = sData[2].map(h => (h || '').toString().trim());
            const sNameIdx = sHeaders.indexOf('Player');
            const sRatingIdx = sHeaders.indexOf('Rating');
            const sMatchesIdx = sHeaders.indexOf('Matches');
            const sRows = sData.slice(3).filter(r => r[sNameIdx] && parseInt(r[sMatchesIdx]) > 0);
            if (sRows.length === 0) return;
            const sMvp = sRows.reduce((a, b) => (parseFloat(a[sRatingIdx]) || 0) > (parseFloat(b[sRatingIdx]) || 0) ? a : b);
            const mvpName = (sMvp[sNameIdx] || '').toString().trim();
            if (mvpName) mvpCount[mvpName] = (mvpCount[mvpName] || 0) + 1;
          });
        } catch (e) { /* MVP count failed */ }

        const topMvp = Object.entries(mvpCount).sort((a, b) => b[1] - a[1])[0];

        let html = '';
        html += buildRecordCard('&#x1F451;', 'Highest Rating Ever', topRating.name, topRating.rating.toFixed(2), getFlagEmoji(topRating.country));
        html += buildRecordCard('&#x1F3AE;', 'Most Matches Played', topMatches.name, topMatches.matches + ' matches', getFlagEmoji(topMatches.country));
        html += buildRecordCard('&#x1F3C6;', 'Most Wins', topWins.name, topWins.wins + ' wins', getFlagEmoji(topWins.country));
        if (highWR) html += buildRecordCard('&#x1F3AF;', 'Best Win Rate (min 10)', highWR.name, (highWR.wins / highWR.matches * 100).toFixed(1) + '%', getFlagEmoji(highWR.country));
        if (topMvp) html += buildRecordCard('&#x1F3C5;', 'Most MVP Awards', topMvp[0], topMvp[1] + 'x MVP', getFlagEmoji(players.find(p => p.name === topMvp[0])?.country));
        if (mostConsistent && mostConsistent.volatility > 0) html += buildRecordCard('&#x1F4AA;', 'Most Consistent', mostConsistent.name, `Vol ${mostConsistent.volatility.toFixed(3)}`, getFlagEmoji(mostConsistent.country));
        container.innerHTML = html || '<div class="state-box state-empty"><div class="state-title">Not enough data.</div></div>';

        const top10 = players.sort((a, b) => b.rating - a.rating).slice(0, 10);
        if (top10.length > 0) {
          const names = top10.map(p => p.name);
          const ratings = top10.map(p => p.rating);
          const ctx = document.getElementById('topChart').getContext('2d');
          currentChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: names, datasets: [{ label: 'Rating', data: ratings, backgroundColor: '#4a86e8cc', borderColor: '#4a86e8', borderWidth: 1 }] },
            options: { responsive: true, scales: { y: { beginAtZero: false, title: { display: true, text: 'Rating' } } }, plugins: { legend: { display: false } } }
          });
          chartCaption.textContent = 'Top 10 Players by Rating (All-Time, Ranked & Active Only)';
          chartSection.style.display = 'block';
        }
      } catch (err) {
        renderState(container, 'error', { detail: err.message, onRetry: loadAllTimeRecords });
      }
    }

    async function loadMonthlyRecords(sheetName) {
      const container = document.getElementById('records-container');
      const chartSection = document.getElementById('chart-section');
      const chartCaption = document.getElementById('chart-caption');
      renderState(container, 'loading', { title: 'Loading monthly records...' });
      chartSection.style.display = 'none';
      destroyChart();

      try {
        const data = await fetchSheetData(sheetName);
        if (data.length < 4) { renderState(container, 'empty', { title: 'No data for this month.' }); return; }
        const headers = data[2].map(h => (h || '').toString().trim());
        const nameIdx = headers.indexOf('Player');
        const ratingIdx = headers.indexOf('Rating');
        const rankIdx = headers.indexOf('Rank');
        const matchesIdx = headers.indexOf('Matches');
        const winsIdx = headers.indexOf('Wins');
        const countryIdx = headers.indexOf('Country');

        const inactiveNames = await getInactivePlayerNames();
        const rows = data.slice(3).filter(r => {
          const rank = (r[rankIdx] || '').toString().trim();
          const name = (r[nameIdx] || '').toString().trim();
          return name && parseInt(r[matchesIdx]) > 0 && rank !== 'Unranked' && !inactiveNames.has(name);
        });

        if (rows.length === 0) { renderState(container, 'empty', { title: 'No ranked active players with matches this month.' }); return; }

        const players = rows.map(r => ({
          name: r[nameIdx],
          rating: parseFloat(r[ratingIdx]),
          matches: parseInt(r[matchesIdx]),
          wins: parseInt(r[winsIdx]),
          country: (r[countryIdx] || 'XX').toString().trim()
        }));

        const topRating = players.reduce((a, b) => a.rating > b.rating ? a : b);
        const topMatches = players.reduce((a, b) => a.matches > b.matches ? a : b);
        const topWins = players.reduce((a, b) => a.wins > b.wins ? a : b);
        const highWR = players.filter(p => p.matches >= 3).sort((a, b) => (b.wins / b.matches) - (a.wins / a.matches))[0];

        let html = '';
        html += buildRecordCard('&#x1F451;', 'Highest Rating This Month', topRating.name, topRating.rating.toFixed(2), getFlagEmoji(topRating.country));
        html += buildRecordCard('&#x1F3AE;', 'Most Matches This Month', topMatches.name, topMatches.matches + ' matches', getFlagEmoji(topMatches.country));
        html += buildRecordCard('&#x1F3C6;', 'Most Wins This Month', topWins.name, topWins.wins + ' wins', getFlagEmoji(topWins.country));
        if (highWR) html += buildRecordCard('&#x1F3AF;', 'Best Win Rate This Month (min 3)', highWR.name, (highWR.wins / highWR.matches * 100).toFixed(1) + '%', getFlagEmoji(highWR.country));
        container.innerHTML = html || '<div class="state-box state-empty"><div class="state-title">Not enough data.</div></div>';

        const top5 = players.sort((a, b) => b.rating - a.rating).slice(0, 5);
        if (top5.length > 0) {
          const names = top5.map(p => p.name);
          const ratings = top5.map(p => p.rating);
          const ctx = document.getElementById('topChart').getContext('2d');
          currentChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: names, datasets: [{ label: 'Rating', data: ratings, backgroundColor: '#e94560cc', borderColor: '#e94560', borderWidth: 1 }] },
            options: { responsive: true, scales: { y: { beginAtZero: false, title: { display: true, text: 'Rating' } } }, plugins: { legend: { display: false } } }
          });
          chartCaption.textContent = `Top 5 Players by Rating (${sheetName.replace('LEADERBOARD_', '')}, Ranked & Active Only)`;
          chartSection.style.display = 'block';
        }
      } catch (err) {
        renderState(container, 'error', { detail: err.message, onRetry: () => loadMonthlyRecords(sheetName) });
      }
    }

    async function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
      const monthSelector = document.getElementById('month-selector');
      destroyChart();
      if (mode === 'alltime') {
        monthSelector.style.display = 'none';
        loadAllTimeRecords();
      } else {
        monthSelector.style.display = 'block';
        const allSheets = await fetchSheetList();
        const leaderboardSheets = allSheets.filter(s => s.startsWith('LEADERBOARD_')).map(s => s.replace('LEADERBOARD_', ''));
        const defaultSheet = getLastCompletedMonth(leaderboardSheets);
        if (defaultSheet) {
          document.getElementById('hof-month-select').value = `LEADERBOARD_${defaultSheet}`;
          loadMonthlyRecords(`LEADERBOARD_${defaultSheet}`);
        } else {
          renderState(document.getElementById('records-container'), 'empty', { title: 'No completed seasons found.' });
          document.getElementById('chart-section').style.display = 'none';
        }
      }
    }

    async function init() {
      await populateMonthSelector('hof-month-select', 'LEADERBOARD_');
      document.getElementById('mode-switch').addEventListener('click', e => {
        if (e.target.classList.contains('mode-btn')) switchMode(e.target.dataset.mode);
      });
      document.getElementById('hof-month-select').addEventListener('change', e => {
        if (e.target.value) loadMonthlyRecords(e.target.value);
      });
      loadAllTimeRecords();
    }

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
  </script>
</body>
</html>
