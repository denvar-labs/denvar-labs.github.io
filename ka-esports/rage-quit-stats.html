<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rage Quit Statistics – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Rage Quit Statistics</h1>
      <p>Each penalty is recorded with date and time. Clean play is rewarded.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">🚫 Rage Quit Counter (with latest occurrence)</div>
          <div class="table-responsive">
            <table id="rq-table" class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Player</th>
                  <th>Country</th>
                  <th>Rage Quits</th>
                  <th>Last Rage Quit</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="5">Loading data…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script>
    async function loadRageQuitStats() {
      const tbody = document.querySelector('#rq-table tbody');
      tbody.innerHTML = '<tr><td colspan="5">Loading…</td></tr>';

      try {
        const [penaltiesData, playersData] = await Promise.all([
          fetchSheetData('PENALTIES'),
          fetchSheetData('PLAYERS')
        ]);

        const playerMap = {};
        if (playersData && playersData.length > 1) {
          const header = playersData[0].map(h => (h || '').toString().trim());
          const idIdx = header.indexOf('ID');
          const nameIdx = header.indexOf('Name');
          const countryIdx = header.indexOf('Country');
          playersData.slice(1).forEach(row => {
            const id = (row[idIdx] || '').toString().trim();
            if (id) {
              playerMap[id] = {
                name: (row[nameIdx] || '').toString().trim(),
                country: (row[countryIdx] || 'XX').toString().trim()
              };
            }
          });
        }

        const playerStats = {}; // playerId -> { count, lastDate }
        if (penaltiesData) {
          penaltiesData.forEach(row => {
            const type = (row[4] || '').toString().trim();
            const status = (row[9] || '').toString().trim();
            if (type === 'RAGE_QUIT' && status === 'Applied') {
              const playerId = (row[1] || '').toString().trim();
              const timestamp = new Date(row[0]);
              if (playerId) {
                if (!playerStats[playerId]) {
                  playerStats[playerId] = { count: 0, lastDate: null };
                }
                playerStats[playerId].count++;
                if (!playerStats[playerId].lastDate || timestamp > playerStats[playerId].lastDate) {
                  playerStats[playerId].lastDate = timestamp;
                }
              }
            }
          });
        }

        const stats = Object.entries(playerStats)
          .map(([id, data]) => {
            const info = playerMap[id] || { name: id, country: 'XX' };
            return {
              name: info.name,
              country: info.country,
              count: data.count,
              lastDate: data.lastDate
            };
          })
          .sort((a, b) => b.count - a.count);

        if (stats.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No rage quits recorded yet. Keep it clean! 🎮</td></tr>';
          return;
        }

        tbody.innerHTML = stats.map((s, i) => {
          const lastStr = s.lastDate
            ? s.lastDate.toISOString().replace('T', ' ').substring(0, 19)
            : '—';
          return `
            <tr>
              <td>${i + 1}</td>
              <td>${escapeHtml(s.name)}</td>
              <td>${getFlagEmoji(s.country)}</td>
              <td><strong>${s.count}</strong></td>
              <td>${lastStr}</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="5">Error loading data: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadRageQuitStats);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
