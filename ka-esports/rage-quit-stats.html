<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rage Quit Statistics – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/esports.css">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">🚫 Rage Quit Counter (with latest occurrence)</div>
          <div class="table-responsive">
            <table id="rq-table" class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Player</th>
                  <th>Country</th>
                  <th>Rage Quits</th>
                  <th>Last Rage Quit</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_rage_quit_stats',
        descKey: 'desc_rage_quit_stats'
      });
    }
    // Confirmed PENALTIES layout (no header row):
    // [0]Timestamp [1]PlayerID [2]PlayerName [3]Reason [4]Type [5]Points [6]Month [7]StartDate [8]EndDate [9]Status
    const PCOL = { timestamp: 0, playerId: 1, playerName: 2, reason: 3, type: 4, points: 5, month: 6, startDate: 7, endDate: 8, status: 9 };

    async function loadRageQuitStats() {
      const tbody = document.querySelector('#rq-table tbody');
      renderTableState(tbody, 5, 'loading');

      try {
        const [penaltiesData, playersData] = await Promise.all([
          fetchSheetData('PENALTIES'),
          fetchSheetData('PLAYERS')
        ]);

        const playerMap = {};
        if (playersData && playersData.length > 1) {
          const header = playersData[0].map(h => (h || '').toString().trim());
          const idIdx = header.indexOf('ID');
          const nameIdx = header.indexOf('Name');
          const countryIdx = header.indexOf('Country');
          playersData.slice(1).forEach(row => {
            const id = (row[idIdx] || '').toString().trim();
            if (id) {
              playerMap[id] = {
                name: (row[nameIdx] || '').toString().trim(),
                country: (row[countryIdx] || 'XX').toString().trim()
              };
            }
          });
        }

        const playerStats = {}; // playerId -> { count, lastDate }
        (penaltiesData || []).forEach(row => {
          const type = (row[PCOL.type] || '').toString().trim();
          const status = (row[PCOL.status] || '').toString().trim();
          if (type === 'RAGE_QUIT' && status === 'Applied') {
            const playerId = (row[PCOL.playerId] || '').toString().trim();
            const timestamp = new Date(row[PCOL.timestamp]);
            if (playerId) {
              if (!playerStats[playerId]) playerStats[playerId] = { count: 0, lastDate: null };
              playerStats[playerId].count++;
              if (!playerStats[playerId].lastDate || (!isNaN(timestamp.getTime()) && timestamp > playerStats[playerId].lastDate)) {
                playerStats[playerId].lastDate = isNaN(timestamp.getTime()) ? playerStats[playerId].lastDate : timestamp;
              }
            }
          }
        });

        const stats = Object.entries(playerStats)
          .map(([id, data]) => {
            const info = playerMap[id] || { name: id, country: 'XX' };
            return { name: info.name, country: info.country, count: data.count, lastDate: data.lastDate };
          })
          .sort((a, b) => b.count - a.count);

        if (stats.length === 0) {
          renderTableState(tbody, 5, 'empty', { title: 'No rage quits recorded yet. Keep it clean! 🎮' });
          return;
        }

        tbody.innerHTML = stats.map((s, i) => {
          const lastStr = s.lastDate ? s.lastDate.toISOString().replace('T', ' ').substring(0, 19) : '—';
          return `
            <tr>
              <td>${i + 1}</td>
              <td>${escapeHtml(s.name)}</td>
              <td>${getFlagEmoji(s.country)}</td>
              <td><strong>${s.count}</strong></td>
              <td>${lastStr}</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        renderTableState(tbody, 5, 'error', { detail: err.message });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadRageQuitStats);
    } else {
      loadRageQuitStats();
    }

  </script>
</body>
</html>
