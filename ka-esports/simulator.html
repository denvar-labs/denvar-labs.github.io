<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .sim-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .sim-row select, .sim-row input { padding: 6px; border-radius: 4px; border: 1px solid var(--border); }
    button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; margin: 10px 0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #sim-result { margin-top: 15px; padding: 15px; background: var(--surface); border-radius: 4px; }
    .player-card { border: 1px solid var(--border); padding: 10px; border-radius: 4px; margin-bottom: 10px; }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com https://unpkg.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="Predict rating changes for a 4-player match using the Glicko-2 simulator.">
  <meta property="og:title" content="Rating Simulator – KA ESPORTS">
  <meta property="og:description" content="Predict rating changes for a 4-player match using the Glicko-2 simulator.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/simulator.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rating Simulator – KA ESPORTS">
  <meta name="twitter:description" content="Predict rating changes for a 4-player match using the Glicko-2 simulator.">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading" data-i18n="simulator_heading">Set Up the Match</div>
          <div id="sim-players"></div>
          <button id="simulate-btn" onclick="simulate()" data-i18n="btn_simulate">Simulate</button>
          <div id="sim-result"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js" defer></script>
  <script src="../js/api-loader.js" defer></script>
  <script src="../js/ui/darkmode.js" defer></script>
  <script src="../js/ui/i18n.js" defer></script>
  <script src="../js/ui/navbar.js" defer></script>
  <script src="../js/ui/header.js" defer></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_simulator',
        descKey: 'desc_simulator'
      });
    }

    // ========== Glicko-2 Simplified Simulator ==========
    function g(phi) { return 1 / Math.sqrt(1 + 3 * phi * phi / (Math.PI * Math.PI)); }
    function E(mu, muJ, phiJ) { return 1 / (1 + Math.exp(-g(phiJ) * (mu - muJ))); }

    function simulateMatch(players, results) {
      const SCALE = 173.7178;
      const internal = players.map(p => ({ ...p, mu: (p.rating - 1500) / SCALE, phi: p.rd / SCALE }));
      const newRatings = [];
      for (let i = 0; i < 4; i++) {
        let vInv = 0, deltaSum = 0;
        for (let j = 0; j < 4; j++) {
          if (i === j) continue;
          const opp = internal[j];
          const gVal = g(opp.phi);
          const eVal = E(internal[i].mu, opp.mu, opp.phi);
          vInv += gVal * gVal * eVal * (1 - eVal);
          deltaSum += gVal * (results[i][j] - eVal);
        }
        const v = 1 / vInv;
        const delta = v * deltaSum;
        const phiStar = Math.sqrt(internal[i].phi * internal[i].phi + players[i].vol * players[i].vol);
        const phiPrime = 1 / Math.sqrt(1 / (phiStar * phiStar) + 1 / v);
        const muPrime = internal[i].mu + phiPrime * phiPrime * deltaSum;
        const newR = muPrime * SCALE + 1500;
        const newRD = phiPrime * SCALE;
        newRatings.push({ name: players[i].name, rating: newR, rd: newRD, change: newR - players[i].rating });
      }
      return newRatings;
    }

    let playerPool = [];

    async function loadPlayers() {
      const container = document.getElementById('sim-players');
      renderState(container, 'loading', { title: I18n.t('simulator_loading') });
      try {
        const all = await fetchSheetData('PLAYERS');
        const header = all[0].map(h => (h || '').toString().trim());
        const nameIdx = header.indexOf('Name');
        const ratingIdx = header.indexOf('Rating');
        const rdIdx = header.indexOf('RD');
        const volIdx = header.indexOf('Volatility');
        const activeIdx = header.indexOf('Active');

        const inactiveNames = await getInactivePlayerNames();

        playerPool = all.slice(1)
          .filter(row => {
            if (activeIdx !== -1) {
              const status = (row[activeIdx] || '').toString().trim().toUpperCase();
              if (status !== 'ACTIVE') return false;
            }
            const name = (row[nameIdx] || '').toString().trim();
            return name && !inactiveNames.has(name);
          })
          .map(row => ({
            name: row[nameIdx],
            rating: parseFloat(row[ratingIdx]),
            rd: parseFloat(row[rdIdx]),
            vol: parseFloat(row[volIdx])
          }))
          .filter(p => p.name && !isNaN(p.rating) && !isNaN(p.rd) && !isNaN(p.vol));

        if (playerPool.length < 4) {
          renderState(container, 'empty', { title: I18n.t('simulator_not_enough') });
          document.getElementById('simulate-btn').disabled = true;
          return;
        }
        buildSelects();
      } catch (err) {
        console.error('Error loading players:', err);
        renderState(container, 'error', { detail: err.message, onRetry: loadPlayers });
        document.getElementById('simulate-btn').disabled = true;
      }
    }

    function buildSelects() {
      const container = document.getElementById('sim-players');
      const options = playerPool.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} (${p.rating.toFixed(0)})</option>`).join('');
      container.innerHTML = [1, 2, 3, 4].map(i => `
        <div class="sim-row">
          <span>${I18n.t('simulator_p')}${i}:</span>
          <select id="player${i}">${options}</select>
          <span>${I18n.t('simulator_pos')}</span>
          <input type="number" id="pos${i}" min="1" max="4" value="${i}">
        </div>
      `).join('');
    }

    function simulate() {
      const selected = [];
      for (let i = 1; i <= 4; i++) {
        const sel = document.getElementById(`player${i}`).value;
        const player = playerPool.find(p => p.name === sel);
        if (!player) { alert(I18n.t('simulator_select_all')); return; }
        const pos = parseInt(document.getElementById(`pos${i}`).value);
        if (isNaN(pos) || pos < 1 || pos > 4) { alert(I18n.t('simulator_invalid_position').replace('{i}', i)); return; }
        selected.push({ ...player, position: pos });
      }
      if (new Set(selected.map(p => p.name)).size < 4) { alert(I18n.t('simulator_duplicate_players')); return; }

      const results = selected.map((p, i) =>
        selected.map((q, j) => {
          if (i === j) return 0;
          if (p.position < q.position) return 1;
          if (p.position > q.position) return 0;
          return 0.5;
        })
      );
      const newRatings = simulateMatch(selected, results);

      const resultDiv = document.getElementById('sim-result');
      resultDiv.innerHTML = '<h3>' + I18n.t('simulator_results') + '</h3>' + newRatings.map(r => `
        <div class="player-card">
          <strong>${escapeHtml(r.name)}</strong>: ${r.rating.toFixed(2)} (${r.change > 0 ? '+' : ''}${r.change.toFixed(2)})
          <br>${I18n.t('simulator_new_rd')} ${r.rd.toFixed(2)}
        </div>
      `).join('');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPlayers);
    } else {
      loadPlayers();
    }
  </script>
</body>
</html>
