  <style>
    .sim-container { max-width: 700px; margin: 0 auto; }
    .sim-instruction { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .sim-instruction i { color: var(--accent); margin-right: 6px; }
    .sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-bottom: 24px; }
    .sim-slot { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; transition: border-color 0.2s, box-shadow 0.2s; }
    .sim-slot:hover { border-color: var(--accent); }
    .sim-slot-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
    .sim-slot select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; }
    .sim-slot-pos { margin-top: 4px; }
    .sim-slot-pos label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; display: block; }
    .sim-slot-pos select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.85rem; }
    .sim-btn-wrap { text-align: center; margin: 8px 0 24px; }
    .sim-btn { padding: 12px 32px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 1rem; transition: transform 0.15s, box-shadow 0.2s; }
    .sim-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(74,134,232,0.3); }
    .sim-btn:active { transform: translateY(0); }
    .sim-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .sim-result { margin-top: 0; }
    .sim-result h3 { text-align: center; margin: 0 0 16px; font-size: 1rem; color: var(--accent); }
    .sim-result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .sim-result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; position: relative; overflow: hidden; }
    .sim-result-card.pos-1 { border-color: #fbbf24; }
    .sim-result-card.pos-1::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #fbbf24, #f59e0b); }
    .sim-result-card.pos-2 { border-color: #9ca3af; }
    .sim-result-card.pos-2::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #d1d5db, #9ca3af); }
    .sim-result-card.pos-3 { border-color: #d97706; }
    .sim-result-card.pos-3::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #d97706, #b45309); }
    .sim-result-card.pos-4 { border-color: var(--border); }
    .sim-result-card.pos-4::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--border); }
    .sim-result-pos { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .sim-result-pos.gold { color: #fbbf24; }
    .sim-result-pos.silver { color: #9ca3af; }
    .sim-result-pos.bronze { color: #d97706; }
    .sim-result-pos.fourth { color: var(--text-muted); }
    .sim-result-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .sim-result-rating { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .sim-result-change { font-size: 1.2rem; font-weight: 800; }
    .sim-result-change.positive { color: #10b981; }
    .sim-result-change.negative { color: #ef4444; }
    .sim-result-change.zero { color: var(--text-muted); }
    .sim-result-rd { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    @media (max-width: 600px) {
      .sim-grid, .sim-result-grid { grid-template-columns: 1fr; }
    }
  </style>

<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="sim-container">
            <div class="section-heading" style="justify-content:center;">
              <span data-i18n="simulator_heading">Set Up the Match</span>
            </div>
            <div class="sim-instruction">
              <i class="ph ph-info" aria-hidden="true"></i>
              <span data-i18n="simulator_instruction">Select 4 different players and assign their finishing positions to predict rating changes.</span>
            </div>
            <div id="sim-players"></div>
            <div class="sim-btn-wrap">
              <button id="simulate-btn" class="sim-btn" onclick="simulate()" data-i18n="btn_simulate">Simulate</button>
            </div>
            <div id="sim-result" class="sim-result"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_simulator',
        descKey: 'desc_simulator'
      });
    }

    // ========== Glicko-2 Simplified Simulator ==========
    function g(phi) { return 1 / Math.sqrt(1 + 3 * phi * phi / (Math.PI * Math.PI)); }
    function E(mu, muJ, phiJ) { return 1 / (1 + Math.exp(-g(phiJ) * (mu - muJ))); }

    function simulateMatch(players, results) {
      const SCALE = 173.7178;
      const internal = players.map(p => ({ ...p, mu: (p.rating - 1500) / SCALE, phi: p.rd / SCALE }));
      const newRatings = [];
      for (let i = 0; i < 4; i++) {
        let vInv = 0, deltaSum = 0;
        for (let j = 0; j < 4; j++) {
          if (i === j) continue;
          const opp = internal[j];
          const gVal = g(opp.phi);
          const eVal = E(internal[i].mu, opp.mu, opp.phi);
          vInv += gVal * gVal * eVal * (1 - eVal);
          deltaSum += gVal * (results[i][j] - eVal);
        }
        const v = 1 / vInv;
        const delta = v * deltaSum;
        const phiStar = Math.sqrt(internal[i].phi * internal[i].phi + players[i].vol * players[i].vol);
        const phiPrime = 1 / Math.sqrt(1 / (phiStar * phiStar) + 1 / v);
        const muPrime = internal[i].mu + phiPrime * phiPrime * deltaSum;
        const newR = muPrime * SCALE + 1500;
        const newRD = phiPrime * SCALE;
        newRatings.push({ name: players[i].name, rating: players[i].rating, rd: players[i].rd, newRating: newR, newRD: newRD, change: newR - players[i].rating });
      }
      return newRatings;
    }

    let playerPool = [];

    async function loadPlayers() {
      const container = document.getElementById('sim-players');
      renderState(container, 'loading', { title: I18n.t('simulator_loading') });
      try {
        const all = await fetchSheetData('PLAYERS');
        const header = all[0].map(h => (h || '').toString().trim());
        const nameIdx = header.indexOf('Name');
        const ratingIdx = header.indexOf('Rating');
        const rdIdx = header.indexOf('RD');
        const volIdx = header.indexOf('Volatility');
        const activeIdx = header.indexOf('Active');

        const inactiveNames = await getInactivePlayerNames();

        playerPool = all.slice(1)
          .filter(row => {
            if (activeIdx !== -1) {
              const status = (row[activeIdx] || '').toString().trim().toUpperCase();
              if (status !== 'ACTIVE') return false;
            }
            const name = (row[nameIdx] || '').toString().trim();
            return name && !inactiveNames.has(name);
          })
          .map(row => ({
            name: row[nameIdx],
            rating: parseFloat(row[ratingIdx]),
            rd: parseFloat(row[rdIdx]),
            vol: parseFloat(row[volIdx])
          }))
          .filter(p => p.name && !isNaN(p.rating) && !isNaN(p.rd) && !isNaN(p.vol))
          .sort((a, b) => b.rating - a.rating);

        if (playerPool.length < 4) {
          renderState(container, 'empty', { title: I18n.t('simulator_not_enough') });
          document.getElementById('simulate-btn').disabled = true;
          return;
        }
        buildSelects();
      } catch (err) {
        console.error('Error loading players:', err);
        renderState(container, 'error', { detail: err.message, onRetry: loadPlayers });
        document.getElementById('simulate-btn').disabled = true;
      }
    }

    function buildSelects() {
      const container = document.getElementById('sim-players');
      const playerOpts = playerPool.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)} (${p.rating.toFixed(0)})</option>`).join('');
      const posOpts = [1,2,3,4].map(n => `<option value="${n}" ${n === 1 ? 'selected' : ''}>${n}${n===1?'st':n===2?'nd':n===3?'rd':'th'}</option>`).join('');
      container.innerHTML = [1, 2, 3, 4].map(i => `
        <div class="sim-grid">
          <div class="sim-slot">
            <div class="sim-slot-label">Player ${i}</div>
            <select id="player${i}">${playerOpts}</select>
          </div>
          <div class="sim-slot sim-slot-pos">
            <div class="sim-slot-label">Finishing Position</div>
            <select id="pos${i}">${[1,2,3,4].map(n => `<option value="${n}" ${n === i ? 'selected' : ''}>${n}${n===1?'st':n===2?'nd':n===3?'rd':'th'}</option>`).join('')}</select>
          </div>
        </div>
      `).join('');
    }

    function simulate() {
      const selected = [];
      for (let i = 1; i <= 4; i++) {
        const sel = document.getElementById(`player${i}`).value;
        const player = playerPool.find(p => p.name === sel);
        if (!player) { alert(I18n.t('simulator_select_all')); return; }
        const pos = parseInt(document.getElementById(`pos${i}`).value);
        if (isNaN(pos) || pos < 1 || pos > 4) { alert(I18n.t('simulator_invalid_position').replace('{i}', i)); return; }
        selected.push({ ...player, position: pos });
      }
      if (new Set(selected.map(p => p.name)).size < 4) { alert(I18n.t('simulator_duplicate_players')); return; }

      const results = selected.map((p, i) =>
        selected.map((q, j) => {
          if (i === j) return 0;
          if (p.position < q.position) return 1;
          if (p.position > q.position) return 0;
          return 0.5;
        })
      );
      const newRatings = simulateMatch(selected, results);

      const posClasses = { 1: 'pos-1', 2: 'pos-2', 3: 'pos-3', 4: 'pos-4' };
      const posLabels = { 1: 'gold', 2: 'silver', 3: 'bronze', 4: 'fourth' };
      const posNames = { 1: '1st Place', 2: '2nd Place', 3: '3rd Place', 4: '4th Place' };
      const posIcons = { 1: '🥇', 2: '🥈', 3: '🥉', 4: '4️⃣' };

      const sorted = [...newRatings].sort((a, b) => {
        const posA = selected.find(p => p.name === a.name).position;
        const posB = selected.find(p => p.name === b.name).position;
        return posA - posB;
      });

      const resultDiv = document.getElementById('sim-result');
      resultDiv.innerHTML = '<h3><i class="ph ph-chart-line-up" aria-hidden="true"></i> Simulation Results</h3><div class="sim-result-grid">' +
        sorted.map(r => {
          const pos = selected.find(p => p.name === r.name).position;
          const changeClass = r.change > 0 ? 'positive' : r.change < 0 ? 'negative' : 'zero';
          const changeStr = r.change > 0 ? '+' + r.change.toFixed(2) : r.change.toFixed(2);
          return `<div class="sim-result-card ${posClasses[pos] || ''}">
            <div class="sim-result-pos ${posLabels[pos] || ''}">${posIcons[pos] || ''} ${posNames[pos] || ''}</div>
            <div class="sim-result-name">${escapeHtml(r.name)}</div>
            <div class="sim-result-rating">Rating: ${r.rating.toFixed(2)} → ${r.newRating.toFixed(2)}</div>
            <div class="sim-result-change ${changeClass}">${changeStr}</div>
            <div class="sim-result-rd">RD: ${r.rd.toFixed(1)} → ${r.newRD.toFixed(1)}</div>
          </div>`;
        }).join('') + '</div>';

      resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPlayers);
    } else {
      loadPlayers();
    }
  </script>
</body>
</html>
