<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Penalty – KA ESPORTS Admin</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .admin-box { max-width: 500px; margin: 30px auto; }
    input, select { width: 100%; padding: 8px; margin: 6px 0; border-radius: 4px; border: 1px solid var(--border); }
    button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Admin – Apply Rage Quit Penalty</h1>
    </header>
    <div class="admin-box panel">
      <label>Player ID (or select name)</label>
      <select id="player-select">
        <option value="">-- Choose player --</option>
      </select>
      <br>
      <label>Or enter Player ID manually:</label>
      <input type="text" id="player-id" placeholder="P_...">
      <br>
      <label>Admin Key</label>
      <input type="password" id="admin-key" placeholder="Secret key">
      <br><br>
      <button onclick="apply()">Apply -40 Penalty</button>
      <div id="result" style="margin-top:16px;"></div>
    </div>
  </div>

  <script>
    // ===== NUEVA URL DE LA WEB APP =====
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMYv9MCqIj4EV_p0W25WcYZnCsBXYTQyugxCVjqFgA8YYFIy66VCOWRFjWgp5l2AiO/exec';

    async function loadPlayers() {
      const players = await fetch(`${SCRIPT_URL}?sheet=PLAYERS`).then(r => r.json());
      if (!players || !players.data) return;
      const header = players.data[0].map(h => h.trim());
      const idIdx = header.indexOf('ID');
      const nameIdx = header.indexOf('Name');
      const rows = players.data.slice(1);
      const select = document.getElementById('player-select');
      rows.forEach(row => {
        const id = row[idIdx];
        const name = row[nameIdx];
        if (id && name) {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = `${name} (${id})`;
          select.appendChild(opt);
        }
      });
    }

    async function apply() {
      const key = document.getElementById('admin-key').value.trim();
      let playerId = document.getElementById('player-id').value.trim();
      if (!playerId) {
        playerId = document.getElementById('player-select').value;
      }
      if (!playerId) {
        alert('Select a player');
        return;
      }
      if (!key) {
        alert('Enter the admin key');
        return;
      }
      const url = `${SCRIPT_URL}?action=applyPenalty&playerId=${encodeURIComponent(playerId)}&key=${encodeURIComponent(key)}`;
      try {
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.error) {
          document.getElementById('result').innerHTML = `<p style="color:red;">${data.error}</p>`;
        } else {
          document.getElementById('result').innerHTML = `<p style="color:green;">${data.message}</p>`;
        }
      } catch (err) {
        document.getElementById('result').innerHTML = `<p style="color:red;">Request failed</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPlayers);
  </script>
</body>
</html>
