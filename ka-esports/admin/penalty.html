<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <title>Admin Panel – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/esports.css">
  <meta name="robots" content="noindex, nofollow">
  <style>
    .admin-box { max-width: 600px; margin: 30px auto; }
    .admin-box input, .admin-box select, .admin-box textarea { width: 100%; padding: 8px; margin: 6px 0; border-radius: 4px; }
    .confirm-box { display: none; }
    .confirm-box.visible { display: block; }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="KA ESPORTS — Mario Kart 64 Competitive Platform">
  <meta property="og:title" content="Admin Panel – KA ESPORTS">
  <meta property="og:description" content="KA ESPORTS — Mario Kart 64 Competitive Platform">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/admin/penalty.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Admin Panel – KA ESPORTS">
  <meta name="twitter:description" content="KA ESPORTS — Mario Kart 64 Competitive Platform">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>

    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <div class="admin-box panel">
      <div class="warning-banner">
        ⚠️ Esta página realiza acciones irreversibles sobre el ranking. Verifica el jugador antes de confirmar.
        La clave de administrador nunca se envía por URL, solo dentro del cuerpo de la petición.
      </div>

      <!-- Rage Quit Penalty -->
      <div class="section">
        <h3>Apply Rage Quit Penalty (-40)</h3>
        <label>Player</label>
        <select id="player-select">
          <option value="">-- Choose player --</option>
        </select>
        <label data-i18n="admin_penalty_or_player_id_manually">Or Player ID manually:</label>
        <input type="text" id="player-id" placeholder="P_...">
        <label data-i18n="admin_penalty_admin_key">Admin Key</label>
        <input type="password" id="admin-key" placeholder="Secret key" autocomplete="off">
        <br><br>
        <button id="penalty-btn" onclick="requestPenaltyConfirm()" data-i18n="admin_penalty_apply_40_penalty">Apply -40 Penalty</button>
        <div id="penalty-confirm" class="confirm-box">
          <p id="penalty-confirm-text"></p>
          <button class="danger" onclick="applyPenalty()" data-i18n="admin_penalty_s_confirmar_penalizacin">Sí, confirmar penalización</button>
          <button class="neutral" onclick="cancelPenaltyConfirm()" data-i18n="admin_penalty_cancelar">Cancelar</button>
        </div>
        <div id="penalty-result" class="result"></div>
      </div>

      <hr>

      <!-- Manual Suspension -->
      <div class="section">
        <h3>Add Manual Suspension</h3>
        <label>Player</label>
        <select id="susp-player-select">
          <option value="">-- Choose player --</option>
        </select>
        <label data-i18n="admin_penalty_or_player_id_manually">Or Player ID manually:</label>
        <input type="text" id="susp-player-id" placeholder="P_...">
        <label data-i18n="admin_penalty_start_date_time">Start Date & Time</label>
        <input type="datetime-local" id="susp-start">
        <label data-i18n="admin_penalty_end_date_time">End Date & Time</label>
        <input type="datetime-local" id="susp-end">
        <label data-i18n="admin_penalty_reason">Reason</label>
        <input type="text" id="susp-reason" placeholder="Conducta antideportiva, etc.">
        <label data-i18n="admin_penalty_admin_key">Admin Key</label>
        <input type="password" id="susp-admin-key" placeholder="Secret key" autocomplete="off">
        <br><br>
        <button id="susp-btn" onclick="requestSuspensionConfirm()" data-i18n="admin_penalty_add_suspension">Add Suspension</button>
        <div id="susp-confirm" class="confirm-box">
          <p id="susp-confirm-text"></p>
          <button class="danger" onclick="addSuspension()" data-i18n="admin_penalty_s_confirmar_suspensin">Sí, confirmar suspensión</button>
          <button class="neutral" onclick="cancelSuspensionConfirm()" data-i18n="admin_penalty_cancelar">Cancelar</button>
        </div>
        <div id="suspension-result" class="result"></div>
      </div>
    </div>
      </main>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api-loader.js"></script>
  <script src="../../js/ui/darkmode.js"></script>
  <script src="../../js/ui/i18n.js"></script>
  <script src="../../js/ui/navbar.js"></script>
  <script src="../../js/ui/header.js"></script>
  <script src="../../js/ui/admin.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_admin',
        descKey: 'desc_admin'
      });
    }

  </script>
</body>
</html>
