<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com; img-src 'self' https: data:; frame-src https://www.twitch.tv https://player.twitch.tv https://www.youtube.com;">
  <title>Monthly Awards – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/esports.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
  <style>
    .awards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .award-card { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; transition: transform 0.2s; }
    .award-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
    .award-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .award-title { font-size: 1rem; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
    .award-player { font-size: 1.4rem; font-weight: 800; color: var(--text); }
    .award-stat { font-size: 0.95rem; color: var(--text-muted); margin-top: 4px; }
    .chart-container { max-width: 900px; margin: 20px auto; }
  </style>
</head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="award-month-select">Season:</label>
            <select id="award-month-select" class="field-select">
              <option value="">-- Choose a month --</option>
            </select>
          </div>

          <div class="awards-grid" id="awards-cards"></div>

          <div id="top5-section" style="display:none;">
            <h3 style="margin-top:20px;">Top 5 Players of the Month</h3>
            <div class="table-responsive">
              <table class="data-table" id="top5-table">
                <thead><tr><th>#</th><th>Player</th><th>Rating</th><th>Wins</th><th>Matches</th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="chart-container" id="chart-section" style="display:none;">
            <canvas id="evolutionChart"></canvas>
            <p style="text-align:center; color:var(--text-muted)">Rating evolution of the Top 5 players during this month</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_awards',
        descKey: 'desc_awards'
      });
    }
    let evolutionChart = null;

    function getLastCompletedMonth(availableMonths) {
      const now = new Date();
      const currentSeasonKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      const completed = availableMonths.filter(m => m < currentSeasonKey).sort().reverse();
      return completed.length > 0 ? completed[0] : null;
    }

    function getPreviousMonthKey(sheetName) {
      const parts = sheetName.split('_');
      if (parts.length < 2) return null;
      const [year, month] = parts[1].split('-').map(Number);
      if (!year || !month) return null;
      if (month === 1) return `${year - 1}-12`;
      return `${year}-${String(month - 1).padStart(2, '0')}`;
    }

    function buildAwardCard(icon, title, player, stat) {
      return `
        <div class="award-card">
          <div class="award-icon">${icon}</div>
          <div class="award-title">${escapeHtml(title)}</div>
          <div class="award-player">${escapeHtml(player)}</div>
          <div class="award-stat">${escapeHtml(stat)}</div>
        </div>
      `;
    }

    async function loadAwards(sheetName) {
      const cardsContainer = document.getElementById('awards-cards');
      const top5Section = document.getElementById('top5-section');
      const chartSection = document.getElementById('chart-section');
      renderState(cardsContainer, 'loading', { title: 'Loading awards…' });
      top5Section.style.display = 'none';
      chartSection.style.display = 'none';

      try {
        const data = await fetchSheetData(sheetName);
        if (data.length < 4) {
          renderState(cardsContainer, 'empty', { title: 'No data for this month.' });
          return;
        }
        const headers = data[2].map(h => (h || '').toString().trim());
        const nameIdx = headers.indexOf('Player');
        const ratingIdx = headers.indexOf('Rating');
        const matchesIdx = headers.indexOf('Matches');
        const winsIdx = headers.indexOf('Wins');

        const inactiveNames = await getInactivePlayerNames();

        const rows = data.slice(3).filter(r => {
          const name = r[nameIdx];
          if (!name) return false;
          if (inactiveNames.has(name.toString().trim())) return false;
          return parseInt(r[matchesIdx]) > 0;
        });

        if (rows.length === 0) {
          renderState(cardsContainer, 'empty', { title: 'No active players with matches this month.' });
          return;
        }

        const players = rows.map(r => ({
          name: r[nameIdx],
          rating: parseFloat(r[ratingIdx]),
          matches: parseInt(r[matchesIdx]),
          wins: parseInt(r[winsIdx])
        }));

        const mvp = players.reduce((a, b) => a.rating > b.rating ? a : b);

        let mostImproved = null;
        const prevKey = getPreviousMonthKey(sheetName);
        if (prevKey) {
          try {
            const prevData = await fetchSheetData(`LEADERBOARD_${prevKey}`);
            if (prevData.length >= 4) {
              const prevHeaders = prevData[2].map(h => (h || '').toString().trim());
              const prevNameIdx = prevHeaders.indexOf('Player');
              const prevRatingIdx = prevHeaders.indexOf('Rating');
              const prevRows = prevData.slice(3).filter(r => r[prevNameIdx]);
              const prevMap = {};
              prevRows.forEach(r => { prevMap[r[prevNameIdx]] = parseFloat(r[prevRatingIdx]); });
              let maxImprovement = -999;
              players.forEach(p => {
                if (prevMap[p.name] !== undefined) {
                  const improvement = p.rating - prevMap[p.name];
                  if (improvement > maxImprovement) {
                    maxImprovement = improvement;
                    mostImproved = { ...p, improvement };
                  }
                }
              });
            }
          } catch (e) { /* previous month sheet may not exist — most-improved falls back to MVP */ }
        }
        if (!mostImproved) mostImproved = { ...mvp, improvement: 0 };

        const risingStars = players.filter(p => p.matches <= 10);
        let risingStar = null;
        if (risingStars.length > 0) {
          risingStar = risingStars.reduce((a, b) => {
            const aWR = a.matches ? a.wins / a.matches : 0;
            const bWR = b.matches ? b.wins / b.matches : 0;
            return aWR > bWR ? a : b;
          });
        }

        const ironWall = players.reduce((a, b) => (a.rd || 0) < (b.rd || 0) ? a : b);

        let html = '';
        html += buildAwardCard('👑', 'MVP of the Month', mvp.name, `${(mvp.rating || 0).toFixed(2)} rating`);
        html += buildAwardCard('🚀', 'Most Improved', mostImproved.name, `+${(mostImproved.improvement || 0).toFixed(2)} points`);
        if (risingStar) {
          const wr = risingStar.matches ? (risingStar.wins / risingStar.matches * 100).toFixed(0) : 0;
          html += buildAwardCard('🌟', 'Rising Star', risingStar.name, `${wr}% win rate (${risingStar.wins}/${risingStar.matches})`);
        }
        html += buildAwardCard('🛡️', 'Iron Wall', ironWall.name, `RD ${(ironWall.rd || 0).toFixed(0)}`);
        cardsContainer.innerHTML = `<div class="awards-grid">${html}</div>`;

        const top5 = players.sort((a, b) => b.rating - a.rating).slice(0, 5);
        const tbody = document.querySelector('#top5-table tbody');
        tbody.innerHTML = top5.map((p, i) => `
          <tr>
            <td>${i + 1}</td>
            <td class="${RANK_CLASS_MAP[getRankFromRating(p.rating)] || ''}">${escapeHtml(p.name)}</td>
            <td>${(p.rating || 0).toFixed(2)}</td>
            <td>${p.wins}</td>
            <td>${p.matches}</td>
          </tr>
        `).join('');
        top5Section.style.display = 'block';

        await drawEvolutionChart(sheetName, top5.map(p => p.name));
      } catch (err) {
        console.error(err);
        renderState(cardsContainer, 'error', { detail: err.message, onRetry: () => loadAwards(sheetName) });
      }
    }

    async function drawEvolutionChart(sheetName, top5Names) {
      const chartSection = document.getElementById('chart-section');
      if (evolutionChart) { evolutionChart.destroy(); evolutionChart = null; }
      if (!top5Names.length) return;

      const matchesAll = await fetchSheetData('MATCHES');
      if (matchesAll.length < 2) { console.warn('No MATCHES data'); return; }

      const matchHeader = matchesAll[0].map(h => (h || '').toString().trim());
      const dateIdx = matchHeader.indexOf('Date');
      const p1Idx = matchHeader.indexOf('Player 1');
      const newRating1Idx = matchHeader.indexOf('New Rating 1');
      if (dateIdx === -1 || p1Idx === -1 || newRating1Idx === -1) {
        console.warn('Missing columns in MATCHES:', { dateIdx, p1Idx, newRating1Idx });
        return;
      }

      const monthKey = sheetName.replace('LEADERBOARD_', '');
      const [y, m] = monthKey.split('-').map(Number);
      const startDate = new Date(y, m - 1, 1);
      const endDate = new Date(y, m, 0, 23, 59, 59);

      const playersData = await fetchSheetData('PLAYERS');
      const idToName = {};
      if (playersData.length > 1) {
        const pHeader = playersData[0].map(h => (h || '').toString().trim());
        const idIdx = pHeader.indexOf('ID');
        const nameIdx = pHeader.indexOf('Name');
        if (idIdx !== -1 && nameIdx !== -1) {
          for (let i = 1; i < playersData.length; i++) {
            const r = playersData[i];
            if (r[idIdx]) idToName[r[idIdx].toString().trim()] = r[nameIdx];
          }
        }
      }

      const ratingSeries = {};
      top5Names.forEach(n => { ratingSeries[n] = []; });

      for (let i = 1; i < matchesAll.length; i++) {
        const row = matchesAll[i];
        const dateVal = row[dateIdx];
        if (!dateVal) continue;
        const date = new Date(dateVal);
        if (isNaN(date.getTime()) || date < startDate || date > endDate) continue;

        for (let j = 0; j < 4; j++) {
          const pid = (row[p1Idx + j] || '').toString().trim();
          const name = idToName[pid];
          if (name && top5Names.includes(name)) {
            const newRating = parseFloat(row[newRating1Idx + j]);
            if (!isNaN(newRating)) ratingSeries[name].push({ date, rating: newRating });
          }
        }
      }

      Object.values(ratingSeries).forEach(series => series.sort((a, b) => a.date - b.date));

      const allDates = new Set();
      top5Names.forEach(name => {
        ratingSeries[name].forEach(p => allDates.add(p.date.toISOString().split('T')[0]));
      });
      const sortedDates = Array.from(allDates).sort();

      const colors = ['#4a86e8', '#e94560', '#10b981', '#f59e0b', '#8b5cf6'];
      const datasets = top5Names.map((name, idx) => {
        const series = ratingSeries[name];
        const dataPoints = sortedDates.map(dateStr => {
          const date = new Date(dateStr);
          let lastRating = null;
          for (const point of series) {
            if (point.date <= date) lastRating = point.rating;
            else break;
          }
          return lastRating;
        });
        return {
          label: name,
          data: dataPoints,
          borderColor: colors[idx % colors.length],
          backgroundColor: colors[idx % colors.length] + '33',
          tension: 0.2,
          fill: false,
          spanGaps: true
        };
      });

      const ctx = document.getElementById('evolutionChart').getContext('2d');
      evolutionChart = new Chart(ctx, {
        type: 'line',
        data: { labels: sortedDates, datasets },
        options: {
          responsive: true,
          scales: {
            x: { title: { display: true, text: 'Date' } },
            y: { title: { display: true, text: 'Rating' } }
          }
        }
      });

      chartSection.style.display = 'block';
    }

    async function init() {
      await populateMonthSelector('award-month-select', 'LEADERBOARD_');
      const allSheets = await fetchSheetList();
      const leaderboardSheets = allSheets.filter(s => s.startsWith('LEADERBOARD_')).map(s => s.replace('LEADERBOARD_', ''));
      const defaultSheet = getLastCompletedMonth(leaderboardSheets);
      if (defaultSheet) {
        document.getElementById('award-month-select').value = `LEADERBOARD_${defaultSheet}`;
        loadAwards(`LEADERBOARD_${defaultSheet}`);
      } else {
        renderState(document.getElementById('awards-cards'), 'empty', { title: 'No completed seasons found.' });
      }
      document.getElementById('award-month-select').addEventListener('change', e => {
        if (e.target.value) loadAwards(e.target.value);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  </script>
</body>
</html>
