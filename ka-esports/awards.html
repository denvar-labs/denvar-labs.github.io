<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Awards – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Monthly Awards</h1>
      <p>Automatic recognition for outstanding performances each month. Select a completed season to see its winners.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="award-month-select">Season:</label>
            <select id="award-month-select" style="margin-left:10px; padding:6px 10px; border-radius:4px; border:1px solid var(--border);">
              <option value="">-- Choose a month --</option>
            </select>
          </div>
          <div id="awards-content">
            <p>Select a month to view its awards.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/api-loader.js"></script>
  <script>
    // ========== Monthly Awards Logic ==========
    
    async function loadAwards(sheetName) {
      const container = document.getElementById('awards-content');
      container.innerHTML = '<p>Loading awards…</p>';

      try {
        const data = await fetchSheetData(sheetName);
        if (data.length < 4) {
          container.innerHTML = '<p>No data available for this month.</p>';
          return;
        }
        
        const headers = data[2].map(h => (h||'').toString().trim());
        const nameIdx = headers.indexOf('Player');
        const ratingIdx = headers.indexOf('Rating');
        const rdIdx = headers.indexOf('RD');
        const matchesIdx = headers.indexOf('Matches');
        const winsIdx = headers.indexOf('Wins');
        
        const rows = data.slice(3).filter(r => r[nameIdx] && r[matchesIdx] > 0);
        if (rows.length === 0) {
          container.innerHTML = '<p>No players with matches in this month.</p>';
          return;
        }

        const players = rows.map(r => ({
          name: r[nameIdx],
          rating: parseFloat(r[ratingIdx]),
          rd: parseFloat(r[rdIdx]),
          matches: parseInt(r[matchesIdx]),
          wins: parseInt(r[winsIdx])
        }));

        // Award 1: Highest Rating
        const highestRating = players.reduce((a,b) => a.rating > b.rating ? a : b);
        // Award 2: Most Consistent (lowest RD)
        const mostConsistent = players.reduce((a,b) => a.rd < b.rd ? a : b);
        // Award 3: Novice of the Month (≤10 matches, highest rating among them)
        const novices = players.filter(p => p.matches <= 10);
        const novice = novices.length > 0 ? novices.reduce((a,b) => a.rating > b.rating ? a : b) : null;

        let html = '';
        html += `<div class="stat-card"><h3>🚀 Highest Rating</h3><div class="value">${highestRating.name} (${highestRating.rating.toFixed(2)})</div></div>`;
        html += `<div class="stat-card"><h3>🎯 Most Consistent</h3><div class="value">${mostConsistent.name} (RD ${mostConsistent.rd.toFixed(0)})</div></div>`;
        if (novice) {
          html += `<div class="stat-card"><h3>🐣 Novice of the Month</h3><div class="value">${novice.name} (${novice.rating.toFixed(2)})</div></div>`;
        } else {
          html += `<p>No novice players this month.</p>`;
        }
        container.innerHTML = html;
      } catch (e) {
        console.error(e);
        container.innerHTML = `<p>Error loading awards: ${e.message}</p>`;
      }
    }

    // Determine last completed month (the most recent month that is strictly before the current month)
    function getLastCompletedMonth(availableMonths) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1; // 1-12
      // The "current season" key would be YYYY-MM. The completed ones are those < current YYYY-MM.
      const currentSeasonKey = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
      // Filter and sort available months that are < currentSeasonKey
      const completed = availableMonths.filter(m => m < currentSeasonKey).sort().reverse();
      return completed.length > 0 ? completed[0] : null;
    }

    async function init() {
      // Populate the month selector with all LEADERBOARD_ sheets
      await populateMonthSelector('award-month-select', 'LEADERBOARD_');
      
      // Determine the default month (last completed)
      const allSheets = await fetchSheetList();
      const leaderboardSheets = allSheets.filter(s => s.startsWith('LEADERBOARD_')).map(s => s.replace('LEADERBOARD_', ''));
      const defaultSheet = getLastCompletedMonth(leaderboardSheets);
      
      if (defaultSheet) {
        document.getElementById('award-month-select').value = `LEADERBOARD_${defaultSheet}`;
        loadAwards(`LEADERBOARD_${defaultSheet}`);
      } else {
        // If no previous month, leave message
        document.getElementById('awards-content').innerHTML = '<p>No completed seasons found.</p>';
      }

      // Handle user selection
      document.getElementById('award-month-select').addEventListener('change', e => {
        if (e.target.value) {
          loadAwards(e.target.value);
        } else {
          document.getElementById('awards-content').innerHTML = '<p>Select a month to view its awards.</p>';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
