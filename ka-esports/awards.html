<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Awards – KA ESPORTS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">KA ESPORTS</div>
      <h1>Monthly Awards</h1>
      <p>Automatic recognition for outstanding performances each month.</p>
    </header>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">Awards for Current Month</div>
          <div id="awards-content">
            <p>Loading…</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/api-loader.js"></script>
  <script>
    async function loadAwards() {
      const now = new Date();
      const month = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      const sheetName = `LEADERBOARD_${month}`;

      try {
        const data = await fetchSheetData(sheetName);
        // data structure: row 0=title, row1=subtitle, row2=headers, row3+ data
        if (data.length < 4) {
          document.getElementById('awards-content').innerHTML = '<p>No data for this month yet.</p>';
          return;
        }
        const headers = data[2].map(h => (h||'').toString().trim());
        const nameIdx = headers.indexOf('Player');
        const ratingIdx = headers.indexOf('Rating');
        const rdIdx = headers.indexOf('RD');
        const matchesIdx = headers.indexOf('Matches');
        const winsIdx = headers.indexOf('Wins');

        const rows = data.slice(3).filter(r => r[nameIdx]);
        const players = rows.map(r => ({
          name: r[nameIdx],
          rating: parseFloat(r[ratingIdx]),
          rd: parseFloat(r[rdIdx]),
          matches: parseInt(r[matchesIdx]),
          wins: parseInt(r[winsIdx])
        })).filter(p => p.matches > 0);

        // Best Progress: compare to previous month rating (we don't have directly, but we can estimate from global? For now, just biggest rating itself)
        // Actually we can get previous month rating if we load previous leaderboard. Simplified: biggest rating in month.
        const bestRating = players.reduce((a,b) => a.rating > b.rating ? a : b, players[0]);
        const mostConsistent = players.reduce((a,b) => a.rd < b.rd ? a : b, players[0]); // lowest RD
        const novice = players.filter(p => p.matches <= 10).sort((a,b) => b.rating - a.rating)[0];

        let html = '';
        if (bestRating) html += `<div class="stat-card"><h3>🚀 Highest Rating</h3><div class="value">${bestRating.name} (${bestRating.rating.toFixed(2)})</div></div>`;
        if (mostConsistent) html += `<div class="stat-card"><h3>🎯 Most Consistent</h3><div class="value">${mostConsistent.name} (RD ${mostConsistent.rd.toFixed(0)})</div></div>`;
        if (novice) html += `<div class="stat-card"><h3>🐣 Novice of the Month</h3><div class="value">${novice.name} (${novice.rating.toFixed(2)})</div></div>`;
        document.getElementById('awards-content').innerHTML = html || '<p>Not enough data.</p>';
      } catch (e) {
        document.getElementById('awards-content').innerHTML = `<p>Error: ${e.message}</p>`;
      }
    }
    document.addEventListener('DOMContentLoaded', loadAwards);
  </script>
  <script>
    fetch("../sidebar.html").then(r => r.text()).then(html => {
      document.getElementById("sidebar-container").innerHTML = html;
    });
  </script>
</body>
</html>
