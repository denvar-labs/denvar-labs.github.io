<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Player Profile – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/esports.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
  <style>
    .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .profile-header .rank-badge { font-size: 1.5rem; padding: 8px 16px; border-radius: 8px; color: #000; font-weight: bold; }
    .chart-container { max-width: 800px; margin: 0 auto 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 8px 0; }
    .stat-card h3 { margin: 0 0 8px; font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .match-history-section { margin-top: 32px; }
    .match-history-section h3 { margin: 0 0 16px; font-size: 1.1rem; }
    .mh-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .mh-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .mh-stat .mh-val { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
    .mh-stat .mh-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
    .mh-dots { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
    .mh-dot { width: 10px; height: 10px; border-radius: 50%; }
    .mh-dot.win { background: #10b981; }
    .mh-dot.podium { background: #f59e0b; }
    .mh-dot.loss { background: #6b7280; }
    .mh-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .mh-table th { text-align: left; padding: 8px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
    .mh-table td { padding: 8px; border-bottom: 1px solid var(--border); }
    .mh-table tr:hover td { background: var(--accent-bg, rgba(74,134,232,0.05)); }
    .mh-delta { font-weight: 600; }
    .mh-delta.pos { color: #10b981; }
    .mh-delta.neg { color: #ef4444; }
    .mh-pos-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; }
    .mh-pos-badge.first { background: #fbbf24; color: #000; }
    .mh-pos-badge.second { background: #d1d5db; color: #000; }
    .mh-pos-badge.third { background: #d97706; color: #fff; }
    .mh-pos-badge.other { background: var(--border); color: var(--text-muted); }
    .mh-opponents { font-size: 0.8rem; color: var(--text-muted); }
    .mh-empty { color: var(--text-muted); padding: 20px; text-align: center; }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="Select a player to view detailed statistics and rating evolution over time.">
  <meta property="og:title" content="Player Profile – KA ESPORTS">
  <meta property="og:description" content="Select a player to view detailed statistics and rating evolution over time.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/player-profile.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Player Profile – KA ESPORTS">
  <meta name="twitter:description" content="Select a player to view detailed statistics and rating evolution over time.">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <label for="player-select" data-i18n="player">Player:</label>
            <select id="player-select" class="field-select">
              <option value="" data-i18n="choose_player">-- Choose a player --</option>
            </select>
          </div>
          <div id="profile-content">
            <div class="state-box state-empty"><div class="state-title" data-i18n="player_profile_select_prompt">Select a player to view their profile.</div></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/toast-advanced.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>
  <script src="../js/ui/follow.js"></script>
  <script src="../js/ui/exports.js"></script>

  <script>
    Navbar.inject('navbar-container');

    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_player_profile',
        descKey: 'desc_player_profile'
      });
    }

    let chart = null;

    async function renderMatchHistory(playerName, container) {
      const section = document.createElement('div');
      section.className = 'match-history-section';
      section.innerHTML = '<h3><i class="ph ph-flag" aria-hidden="true"></i> Match History</h3><div class="mh-empty">Loading match history...</div>';
      container.appendChild(section);

      try {
        const matches = await fetchPlayerMatchHistory(playerName);
        if (matches.length === 0) {
          section.innerHTML = '<h3><i class="ph ph-flag" aria-hidden="true"></i> Match History</h3><div class="mh-empty">No match history found.</div>';
          return;
        }

        const total = matches.length;
        const wins = matches.filter(m => m.posNum === 1).length;
        const podiums = matches.filter(m => m.posNum >= 1 && m.posNum <= 3).length;
        const avgPos = matches.reduce((s, m) => s + (m.posNum || 0), 0) / total;
        let streak = 0, curStreak = 0;
        for (let i = 0; i < matches.length; i++) {
          if (matches[i].posNum === 1) { curStreak++; if (curStreak > streak) streak = curStreak; }
          else curStreak = 0;
        }
        const form = matches.slice(-5);
        const formStr = form.map(m => m.posNum === 1 ? '🏆' : m.posNum <= 3 ? '🟡' : '⬛').join(' ');

        const dotsHtml = matches.slice(-30).map(m => {
          const cls = m.posNum === 1 ? 'win' : m.posNum <= 3 ? 'podium' : 'loss';
          return '<span class="mh-dot ' + cls + '" title="Match ' + m.matchId + ': ' + m.pos + '"></span>';
        }).join('');

        let tableHtml = '<div style="overflow-x:auto;"><table class="mh-table"><thead><tr>';
        tableHtml += '<th>Date</th><th>Match</th><th>Pos</th><th>Pts</th><th>Δ Rating</th><th>Opponents</th>';
        tableHtml += '</tr></thead><tbody>';
        const reversed = [...matches].reverse();
        reversed.forEach(m => {
          const posClass = m.posNum === 1 ? 'first' : m.posNum === 2 ? 'second' : m.posNum === 3 ? 'third' : 'other';
          const deltaHtml = m.delta != null ? '<span class="mh-delta ' + (m.delta >= 0 ? 'pos' : 'neg') + '">' + (m.delta >= 0 ? '+' : '') + m.delta.toFixed(2) + '</span>' : '—';
          const oppStr = m.opponents.map(o => escapeHtml(o.name) + ' (' + o.pts + ')').join(', ');
          tableHtml += '<tr><td>' + escapeHtml(m.date) + '</td><td>' + escapeHtml(m.matchId) + '</td><td><span class="mh-pos-badge ' + posClass + '">' + escapeHtml(m.pos) + '</span></td><td>' + m.pts + '</td><td>' + deltaHtml + '</td><td class="mh-opponents">' + oppStr + '</td></tr>';
        });
        tableHtml += '</tbody></table></div>';

        section.innerHTML = '<h3><i class="ph ph-flag" aria-hidden="true"></i> Match History</h3>' +
          '<div class="mh-summary">' +
          '<div class="mh-stat"><div class="mh-val">' + total + '</div><div class="mh-lbl">Total Races</div></div>' +
          '<div class="mh-stat"><div class="mh-val">' + wins + '</div><div class="mh-lbl">Wins</div></div>' +
          '<div class="mh-stat"><div class="mh-val">' + podiums + '</div><div class="mh-lbl">Podiums</div></div>' +
          '<div class="mh-stat"><div class="mh-val">' + avgPos.toFixed(1) + '</div><div class="mh-lbl">Avg Position</div></div>' +
          '<div class="mh-stat"><div class="mh-val">' + streak + '</div><div class="mh-lbl">Best Streak</div></div>' +
          '<div class="mh-stat"><div class="mh-val" style="font-size:0.9rem">' + formStr + '</div><div class="mh-lbl">Last 5</div></div>' +
          '</div>' +
          '<div style="margin-bottom:12px;"><button class="btn-export-mh" data-player="' + escapeHtml(playerName) + '" style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:0.85rem;"><i class="ph ph-download" aria-hidden="true"></i> Export CSV</button></div>' +
          '<div class="mh-dots" title="Last 30: 🟢=Win 🟡=Podium ⬛=Loss">' + dotsHtml + '</div>' +
          tableHtml;

        section.querySelector('.btn-export-mh')?.addEventListener('click', function() {
          const table = section.querySelector('.mh-table');
          if (table) ExportUtils.exportCSV(table, playerName.replace(/\s+/g, '-').toLowerCase() + '-matches-{date}.csv');
        });
      } catch (err) {
        console.warn('Match history error:', err);
        section.innerHTML = '<h3><i class="ph ph-flag" aria-hidden="true"></i> Match History</h3><div class="mh-empty">Could not load match history.</div>';
      }
    }

    async function init() {
      const names = await fetchPlayerNames();
      populateSelectFromList('player-select', names, I18n.t('choose_player'));
      document.getElementById('player-select').addEventListener('change', e => {
        if (e.target.value) loadProfile(e.target.value);
      });
    }

    async function loadProfile(playerName) {
      const container = document.getElementById('profile-content');
      renderState(container, 'loading', { title: I18n.t('loading') });

      try {
        const inactiveNames = await getInactivePlayerNames();
        if (inactiveNames.has(playerName)) {
          renderState(container, 'empty', { title: I18n.t('player_profile_inactive') });
          return;
        }

        const players = await fetchSheetData('PLAYERS');
        const header = players[0].map(h => (h || '').toString().trim());
        const nameIdx = header.indexOf('Name');
        const idIdx = header.indexOf('ID');
        const ratingIdx = header.indexOf('Rating');
        const rdIdx = header.indexOf('RD');
        const volIdx = header.indexOf('Volatility');
        const matchesIdx = header.indexOf('Matches');
        const winsIdx = header.indexOf('Wins');
        const lastMatchIdx = header.indexOf('LastMatch');

        const playerRow = players.find(row => (row[nameIdx] || '').toString().trim() === playerName);
        if (!playerRow) {
          renderState(container, 'empty', { title: I18n.t('player_profile_not_found') });
          return;
        }

        const playerId = playerRow[idIdx];
        const rating = parseFloat(playerRow[ratingIdx]);
        const rd = parseFloat(playerRow[rdIdx]);
        const vol = parseFloat(playerRow[volIdx]);
        const totalMatches = parseInt(playerRow[matchesIdx]) || 0;
        const totalWins = parseInt(playerRow[winsIdx]) || 0;
        const lastMatch = playerRow[lastMatchIdx] ? new Date(playerRow[lastMatchIdx]) : null;
        const rank = getRankFromRating(rating);

        const matchesAll = await fetchSheetData('MATCHES');
        if (matchesAll.length < 2) {
          renderState(container, 'empty', { title: I18n.t('player_profile_no_data') });
          return;
        }
        const matchHeader = matchesAll[0].map(h => (h || '').toString().trim());
        const p1Idx = matchHeader.indexOf('Player 1');
        const dateIdx = matchHeader.indexOf('Date');
        const statusIdx = matchHeader.indexOf('Status');
        const newRating1Idx = matchHeader.indexOf('New Rating 1');

        if (p1Idx === -1 || dateIdx === -1 || statusIdx === -1 || newRating1Idx === -1) {
          renderState(container, 'error', { title: I18n.t('player_profile_columns_not_found') });
          return;
        }

        const playerMatches = [];
        for (let i = 1; i < matchesAll.length; i++) {
          const row = matchesAll[i];
          if (!row || row[statusIdx] !== 'PROCESSED') continue;
          const matchPlayerIds = [];
          for (let j = 0; j < 4; j++) matchPlayerIds.push((row[p1Idx + j] || '').toString().trim());
          const pIdx = matchPlayerIds.indexOf(playerId);
          if (pIdx === -1) continue;
          const dateVal = row[dateIdx];
          if (!dateVal) continue;
          const date = new Date(dateVal);
          if (isNaN(date.getTime())) continue;
          const newRating = parseFloat(row[newRating1Idx + pIdx]);
          if (isNaN(newRating)) continue;
          playerMatches.push({ date, rating: newRating });
        }
        playerMatches.sort((a, b) => a.date - b.date);

        const lastMatchStr = lastMatch ? lastMatch.toISOString().split('T')[0] : I18n.t('player_profile_never');
        const winRate = totalMatches ? (totalWins / totalMatches * 100).toFixed(1) : '0.0';

        container.innerHTML = `
          <div class="profile-header">
            <span class="rank-badge" style="background-color:${getRankColorHex(rank)}">${escapeHtml(rank)}</span>
            <h2>${escapeHtml(playerName)}</h2>
            <span id="follow-btn-slot"></span>
          </div>
          <div class="stats-grid">
            <div class="stat-card"><h3>${I18n.t('col_rating')}</h3><div class="value">${isNaN(rating) ? '—' : rating.toFixed(2)}</div></div>
            <div class="stat-card"><h3>${I18n.t('col_rd')}</h3><div class="value">${isNaN(rd) ? '—' : rd.toFixed(2)}</div></div>
            <div class="stat-card"><h3>${I18n.t('col_volatility')}</h3><div class="value">${isNaN(vol) ? '—' : vol.toFixed(4)}</div></div>
            <div class="stat-card"><h3>${I18n.t('col_matches')}</h3><div class="value">${totalMatches}</div></div>
            <div class="stat-card"><h3>${I18n.t('col_wins')}</h3><div class="value">${totalWins} (${winRate}%)</div></div>
            <div class="stat-card"><h3>${I18n.t('col_last_match')}</h3><div class="value" style="font-size:1rem">${escapeHtml(lastMatchStr)}</div></div>
          </div>
          ${playerMatches.length > 0 ? `
            <div class="chart-container">
              <canvas id="ratingChart"></canvas>
              <p style="text-align:center; color:var(--text-muted)">${I18n.t('player_profile_evolution')}</p>
            </div>
          ` : `<div class="state-box state-empty" style="margin-top:20px;"><div class="state-title">${I18n.t('player_profile_no_matches')}</div></div>`}
        `;

        if (playerMatches.length > 0) {
          const ctx = document.getElementById('ratingChart').getContext('2d');
          const last50 = playerMatches.slice(-50);
          const labels = last50.map(m => m.date.toISOString().split('T')[0]);
          const dataPoints = last50.map(m => m.rating);
          if (chart) chart.destroy();
          chart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: I18n.t('chart_label_rating'),
                data: dataPoints,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1,
                fill: false
              }]
            },
            options: {
              responsive: true,
              scales: {
                y: { beginAtZero: false, title: { display: true, text: I18n.t('chart_label_rating') } },
                x: { title: { display: true, text: I18n.t('chart_label_date') } }
              }
            }
          });
        }

        renderMatchHistory(playerName, container);

        const followSlot = document.getElementById('follow-btn-slot');
        if (followSlot && typeof KaFollows !== 'undefined') {
          followSlot.appendChild(KaFollows.createButton(playerName));
        }
      } catch (err) {
        console.error(err);
        renderState(container, 'error', { detail: err.message, onRetry: () => loadProfile(playerName) });
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  </script>
</body>
</html>
