<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Leaderboard – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">All Players</div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/header.js"></script>
  <script src="../js/ui/exports.js"></script>
  <script src="../js/ui/pagination.js"></script>
  <script src="../js/ui/selection.js"></script>
  <script src="../js/ui/column-resize.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    // Inject page header
    PageHeader.inject('page-header', {
      title: 'Global Leaderboard',
      description: 'Overall ranking based on the Glicko-2 system.',
      actions: [
        { id: 'screenshot-btn', icon: '📸', label: 'Screenshot', ariaLabel: 'Download high-res screenshot of table' },
        { id: 'csv-btn', icon: '📥', label: 'CSV', ariaLabel: 'Download table as CSV' }
      ]
    });

    // Load table data
    document.addEventListener('DOMContentLoaded', () => {
      loadTableFromSheet('LEADERBOARD_GLOBAL', 'data-table');

      // Initialize pagination after data loads
      setTimeout(() => {
        TablePagination.create('data-table', { pageSize: 25 });
        ColumnResize.create('data-table');
      }, 2000);
    });

    // Bind export buttons
    ExportUtils.bindCSV('csv-btn', 'data-table', 'global-leaderboard-{date}.csv');
    ExportUtils.bindScreenshot('screenshot-btn', 'data-table', 'global-leaderboard-{date}.png');

    // Table enhance: sort, filter, column picker, deep links
    (function () {
      const script = document.createElement('script');
      script.src = '../js/table-enhance.js';
      script.onload = () => {
        new TableEnhance('data-table').init({
          sortable: true,
          filterable: true,
          filterPlaceholder: 'Search players...',
          columnPicker: true,
          deepLink: true
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
