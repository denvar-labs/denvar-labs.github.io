<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Leaderboard – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/esports.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">
</head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">All Players</div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api-loader.js"></script>
  <script src="../js/ui/toast-advanced.js"></script>
  <script src="../js/ui/darkmode.js"></script>
  <script src="../js/ui/i18n.js"></script>
  <script src="../js/ui/navbar.js"></script>
  <script src="../js/ui/header.js"></script>

  <script src="../js/ui/exports.js"></script>
  <script src="../js/ui/column-resize.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script>
    Navbar.inject('navbar-container');

    // Inject page header
    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_global_leaderboard',
        descKey: 'desc_global_leaderboard',
        actions: [
          { id: 'screenshot-btn', icon: '📸', labelKey: 'btn_screenshot', ariaLabel: 'Download high-res screenshot of table' },
          { id: 'csv-btn', icon: '📥', labelKey: 'btn_csv', ariaLabel: 'Download table as CSV' }
        ]
      });
    }

    // Load table data
    function initLeaderboard() {
      loadTableFromSheet('LEADERBOARD_GLOBAL', 'data-table');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLeaderboard);
    } else {
      initLeaderboard();
    }

    // Bind export buttons
    ExportUtils.bindCSV('csv-btn', 'data-table', 'global-leaderboard-{date}.csv');
    ExportUtils.bindScreenshot('screenshot-btn', 'data-table', 'global-leaderboard-{date}.png');

    // Table enhance: sort, filter, column picker, deep links
    (function () {
      const script = document.createElement('script');
      script.src = '../js/table-enhance.js';
      script.onload = () => {
        new TableEnhance('data-table').init({
          sortable: true,
          filterable: true,
          filterPlaceholder: 'Search players...',
          columnPicker: true,
          deepLink: true
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
