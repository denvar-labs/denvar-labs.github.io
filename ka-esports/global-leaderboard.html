<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Global Leaderboard – KA ESPORTS</title>
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/esports.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://static-cdn.jtvnw.net; connect-src 'self' https://script.google.com https://*.script.google.com https://script.googleusercontent.com https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' https://player.twitch.tv https://www.youtube.com; object-src 'none';">

  <meta name="description" content="Overall ranking based on the Glicko-2 system. Compete for the top position in Mario Kart 64.">
  <meta property="og:title" content="Global Leaderboard – KA ESPORTS">
  <meta property="og:description" content="Overall ranking based on the Glicko-2 system. Compete for the top position in Mario Kart 64.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://denvar-labs.github.io/ka-esports/global-leaderboard.html">
  <meta property="og:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Global Leaderboard – KA ESPORTS">
  <meta name="twitter:description" content="Overall ranking based on the Glicko-2 system. Compete for the top position in Mario Kart 64.">
  <meta name="twitter:image" content="https://denvar-labs.github.io/ka-esports/og-image.png">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script></head>
<body>
  <div id="navbar-container"></div>
  <div class="wrap">
    <div id="page-header"></div>
    <div class="grid">
      <div id="sidebar-container"></div>
      <main class="content">
        <section class="panel">
          <div class="section-heading">
            <span data-i18n="leaderboard_all_players">All Players</span>
            <div class="season-filter-group">
              <label for="season-select" data-i18n="season_archive">Season Archive:</label>
              <select id="season-select" class="field-select">
                <option value="" data-i18n="all_seasons">All Seasons</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table id="data-table" class="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js" defer></script>
  <script src="../js/api-loader.js" defer></script>
  <script src="../js/ui/toast-advanced.js" defer></script>
  <script src="../js/ui/darkmode.js" defer></script>
  <script src="../js/ui/i18n.js" defer></script>
  <script src="../js/ui/navbar.js" defer></script>
  <script src="../js/ui/header.js" defer></script>
  <script src="../js/ui/follow.js" defer></script>

  <script src="../js/ui/exports.js" defer></script>
  <script src="../js/ui/column-resize.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script>
    Navbar.inject('navbar-container');

    // Inject page header
    if (typeof PageHeader !== 'undefined') {
      PageHeader.inject('page-header', {
        titleKey: 'title_global_leaderboard',
        descKey: 'desc_global_leaderboard',
        actions: [
          { id: 'screenshot-btn', icon: '📸', labelKey: 'btn_screenshot', ariaLabel: 'Download high-res screenshot of table' },
          { id: 'csv-btn', icon: '📥', labelKey: 'btn_csv', ariaLabel: 'Download table as CSV' }
        ]
      });
    }

    let currentSeason = '';

    // Load table data
    async function initLeaderboard() {
      await populateSeasonSelector();
      loadTableFromSheet('LEADERBOARD_GLOBAL', 'data-table');
    }

    async function populateSeasonSelector() {
      const select = document.getElementById('season-select');
      if (!select) return;
      try {
        const allSheets = await fetchSheetList();
        const seasons = allSheets.filter(name => name.startsWith('LEADERBOARD_') && name !== 'LEADERBOARD_GLOBAL').sort().reverse();
        select.innerHTML = '<option value="" data-i18n="all_seasons">All Seasons</option>';
        seasons.forEach(name => {
          const display = name.replace('LEADERBOARD_', '').replace(/_/g, '-');
          const option = document.createElement('option');
          option.value = name;
          option.textContent = display;
          select.appendChild(option);
        });
        if (seasons.length === 0) {
          select.innerHTML = '<option value="">No seasons found</option>';
        }
      } catch (err) {
        console.error('Error populating season selector:', err);
      }
    }

    async function loadSeason(sheetName) {
      currentSeason = sheetName;
      if (sheetName) {
        await loadTableFromSheet(sheetName, 'data-table');
      } else {
        await loadTableFromSheet('LEADERBOARD_GLOBAL', 'data-table');
      }
      addFollowButtonsToTable('data-table');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initLeaderboard);
    } else {
      initLeaderboard();
    }

    // Bind export buttons
    ExportUtils.bindCSV('csv-btn', 'data-table', 'global-leaderboard-{date}.csv');
    ExportUtils.bindScreenshot('screenshot-btn', 'data-table', 'global-leaderboard-{date}.png');

    // Season filter change handler
    document.getElementById('season-select')?.addEventListener('change', e => {
      loadSeason(e.target.value);
    });

    // Table enhance: sort, filter, column picker, deep links
    (function () {
      const script = document.createElement('script');
      script.src = 'js/table-enhance.js';
      script.onload = () => {
        new TableEnhance('data-table').init({
          sortable: true,
          filterable: true,
          filterPlaceholder: I18n.t('search_players'),
          columnPicker: true,
          deepLink: true
        });
        addFollowButtonsToTable('data-table');
      };
      document.body.appendChild(script);
    })();

    function addFollowButtonsToTable(tableId) {
      if (typeof KaFollows === 'undefined') return;
      const table = document.getElementById(tableId);
      if (!table) return;
      const rows = table.querySelectorAll('tbody tr');
      rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length === 0) return;
        const nameCell = cells[0];
        const link = nameCell.querySelector('a');
        if (!link) return;
        const playerName = link.textContent.trim();
        if (!playerName) return;
        const btn = KaFollows.createButton(playerName);
        btn.style.marginLeft = '6px';
        btn.style.verticalAlign = 'middle';
        btn.style.fontSize = '0.85rem';
        btn.style.padding = '2px 5px';
        link.parentNode.insertBefore(btn, link.nextSibling);
      });
    }
  </script>
</body>
</html>
